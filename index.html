<script>
/* Google Fonts is a third-party request, so it only loads after the visitor allows it (see the consent banner). */
function loadFonts() {
  if (document.getElementById('pr-font')) return;
  var a = document.createElement('link'); a.rel = 'preconnect'; a.href = 'https://fonts.googleapis.com';
  var b = document.createElement('link'); b.rel = 'preconnect'; b.href = 'https://fonts.gstatic.com'; b.crossOrigin = '';

}

}

    --a-plenty-t:#2DB36A; --a-some-t:#E8AE2A; --a-few-t:#F07A3A; --a-full-t:#ED5667; --on-lv:#09111E;

html{font-size:106.25%}   /* 17px at the browser's default size, and it follows the browser's own text size setting */
@supports (-webkit-touch-callout:none){html{font:-apple-system-body}}   /* on iPhone, Settings > Display & Brightness > Text Size and Larger Text */
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;overscroll-behavior:none;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:0.8824rem;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button,[data-act],.tab,.chip{touch-action:manipulation}
button,.tabs,#map,.lotpin{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#panel,#sheet,#searchRes,#onboard{overscroll-behavior:contain}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

#app{position:relative;height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
@media (min-width:600px){#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.12)}}

/* The map runs to the top of the screen. In the installed app the status bar sits over it, so a strip keeps the clock readable:
   a soft navy fade on the map, a solid strip on the other tabs. In a browser tab the inset is 0 and the strip has no height. */
.sbar{position:absolute;left:0;right:0;top:0;height:var(--sat);background:var(--brand-navy);z-index:7;pointer-events:none}
#app[data-tab="map"] .sbar{height:calc(var(--sat) * 1.55);background:linear-gradient(to bottom,rgba(19,39,74,.92),rgba(19,39,74,.55) 55%,rgba(19,39,74,0))}
.mode{position:absolute;right:12px;top:calc(12px + var(--sat));z-index:3;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(15,27,46,.14)}
.mode i{width:12px;height:12px;border-radius:50%;background:var(--muted)}
.mode.on i{background:var(--a-plenty);box-shadow:0 0 0 6px color-mix(in srgb,var(--a-plenty) 28%,transparent)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.search{position:absolute;left:12px;right:66px;top:calc(12px + var(--sat));z-index:3;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:46px;box-shadow:0 2px 10px rgba(15,27,46,.14)}
.search svg{width:18px;height:18px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:0.9412rem;height:100%;color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.field input::placeholder{color:var(--muted);opacity:1}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}

main{position:relative;flex:1;min-height:0}
#mapWrap{position:absolute;inset:0}
#map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:var(--land)}
#map:active{cursor:grabbing}
#panel{position:absolute;inset:0;padding-top:var(--sat);overflow:auto;background:var(--bg);-webkit-overflow-scrolling:touch}

/* map svg classes */
.lot{fill:transparent;stroke:none}
.lotsel-c{fill:none;stroke:#fff;stroke-width:7;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.lotsel{fill:rgba(255,255,255,.25);stroke:var(--brand-navy);stroke-width:3.2;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.veil{fill:rgba(12,22,38,.52);pointer-events:none}
.zfo{fill:none;stroke:#fff;stroke-width:2.4;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
/* Mapbox street/satellite map, drawn under the SVG overlays. Slightly oversized: a tiny corrective
   transform lines Mapbox up exactly with the campus-map pixel grid (see GEO below). */
#mbmap{position:absolute;inset:-12px;pointer-events:none;visibility:hidden;background:var(--land)}
#mapWrap.mb #mbmap{visibility:visible}
#map{position:relative}
#mapWrap.mb #map{background:transparent}
#mapWrap.mb #baseL{display:none}
#mapWrap.mb{--gap:#fff}
#mapWrap.flat{--gap:var(--land)}   /* no Mapbox: lots are drawn on the plain background */
:root[data-theme="dark"] #mapWrap.mb{--gap:#0B1422}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #mapWrap.mb{--gap:#0B1422}}
/* Lots over Mapbox: the zone-colored shape, then a screen-width separator so neighbors never run together,
   then a thin edge in the lot's own color. */
#mapWrap.mb .lot,#mapWrap.flat .lot{fill:var(--zc);fill-opacity:.58;stroke:none}
#mapWrap.mb.sat .lot{fill-opacity:.6}
#mapWrap.mb .lot.fac,#mapWrap.flat .lot.fac{fill-opacity:.75}
.medot{fill:#1A73E8;stroke:#fff;stroke-width:3;pointer-events:none}
.mehalo{fill:rgba(26,115,232,.2);pointer-events:none;transform-box:fill-box;transform-origin:center;animation:mepulse 1.6s ease-in-out infinite alternate}
@keyframes mepulse{from{transform:scale(.7)}to{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.mehalo{animation:none}}
.carmenu{position:absolute;left:12px;right:12px;bottom:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.carmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;text-align:left;font-weight:600;font-size:0.8824rem}
.carmenu button + button{border-top:1px solid var(--line)}
.carmenu button svg{width:20px;height:20px;flex:none;color:var(--navy)}
:root[data-theme="dark"] .carmenu button svg{color:#8FB3FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .carmenu button svg{color:#8FB3FF}}
.lotcs,.lotbd{display:none;fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}
#mapWrap.mb .lotcs,#mapWrap.mb .lotbd,#mapWrap.flat .lotcs,#mapWrap.flat .lotbd{display:inline}
#mapWrap.mb .lotcs,#mapWrap.flat .lotcs{stroke:var(--gap);stroke-width:3;stroke-opacity:.95}
#mapWrap.mb.sat .lotcs{stroke-opacity:.85}
#mapWrap.mb .lotbd,#mapWrap.flat .lotbd{stroke:color-mix(in srgb,var(--zc) 70%,#000);stroke-width:1}
#mapWrap.mb .lotbd.fac,#mapWrap.flat .lotbd.fac{stroke:#6F7B8C}
:root[data-theme="dark"] #mapWrap.mb .rt{stroke:#6FA3FF}
:root[data-theme="dark"] #mapWrap.mb .rt-c{stroke:#0B1422}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) #mapWrap.mb .rt{stroke:#6FA3FF}
  :root:not([data-theme="light"]) #mapWrap.mb .rt-c{stroke:#0B1422}
}
#mapWrap > .mapboxgl-control-container > div{z-index:auto}
#mapWrap:not(.mb) > .mapboxgl-control-container{display:none}
#mapWrap .mapboxgl-ctrl-attrib{font-size:0.6176rem;line-height:18px}
.mapmenu{position:absolute;right:64px;top:calc(68px + var(--sat));min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mapmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left;font-weight:600;font-size:0.8824rem}
.mapmenu button + button{border-top:1px solid var(--line)}
.mapmenu button svg{width:20px;height:20px;flex:none;color:var(--muted)}
.mapmenu.hi{top:calc(12px + var(--sat))}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mapmenu .ck{color:#8FB3FF}}
.lotpin{transition:opacity .2s}
.dim{opacity:.22}
.bl{font-size:0.6471rem;font-weight:700;fill:#10223F;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;cursor:pointer}
.rl{font-size:0.5588rem;font-weight:600;font-style:italic;fill:var(--muted);text-anchor:middle}
.gl{font-size:0.8824rem;font-weight:800;font-stretch:110%;fill:#1E4D22;text-anchor:middle;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:4px;stroke-linejoin:round;cursor:pointer}
.pbg{fill:var(--navy);stroke:var(--surface);stroke-width:1.8}
.ptx{fill:#fff;font-size:0.6176rem;font-weight:800;text-anchor:middle}
.lvl{stroke:var(--surface);stroke-width:1.6}
.lvl.rep{fill:var(--lc)}
.lvl.est{fill:var(--surface);stroke:var(--lc);stroke-width:2}

.lotpin.sel .pbg{fill:var(--red)}
.ebg{fill:var(--red);stroke:#fff;stroke-width:2.5}
.eic{fill:#fff}
.pulse{fill:var(--red);opacity:.5;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.5}to{transform:scale(2.7);opacity:0}}
.cbg{fill:var(--brand-navy);stroke:#fff;stroke-width:2.5}
:root[data-theme="dark"] .cbg{fill:#2B4F8C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cbg{fill:#2B4F8C}}
.cic{fill:#fff}
.clbg{fill:var(--a-some);stroke:#fff;stroke-width:2.5}
.dbg{fill:var(--red);stroke:#fff;stroke-width:2}
.rt-c{fill:none;stroke:var(--surface);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rt{fill:none;stroke:var(--navy);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.m-land{fill:var(--land)}.m-water{fill:var(--water)}.m-creek{fill:none;stroke:var(--water)}.m-block{fill:var(--block)}.m-green{fill:var(--green)}.m-green2{fill:var(--green-2)}
.m-bldg{fill:var(--bldg);stroke:var(--bldg-line);stroke-width:2}.m-cas{stroke:var(--casing);fill:none}.m-road{stroke:var(--road);fill:none}.m-stall{stroke:var(--stall)}

/* map overlay UI */
.ctrls.round{border-radius:999px}
.ctrls.mt{margin-bottom:10px;position:static;border-radius:999px}

.pill{position:absolute;left:12px;top:calc(12px + var(--sat));display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 12px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:650;font-size:0.8235rem;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.pill svg{width:18px;height:18px;color:var(--navy)}
.pickbar{position:absolute;left:12px;right:66px;top:calc(12px + var(--sat));display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--brand-navy);color:#fff;font-size:0.8235rem;font-weight:600;box-shadow:var(--shadow)}
.pickbar span{flex:1}
.pickbar button{min-height:32px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.14);color:#fff;font-weight:650;font-size:0.7647rem}
.mapcard{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 12px;box-shadow:var(--shadow)}
.card .chev{margin-left:auto}
.carchip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px 0 8px;border-radius:999px;background:var(--brand-navy);color:#fff;font-size:0.7941rem;font-weight:600;box-shadow:var(--shadow-sm);max-width:100%}
.carchip .ci{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.carchip .ci svg{width:16px;height:16px}
.carchip em{font-style:normal;opacity:.7;font-weight:500;white-space:nowrap}
.carchip .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carchip.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.carchip.ghost .ci{background:var(--surface-2);color:var(--navy)}
.more{align-self:flex-end;margin-top:-2px;font-size:0.7647rem;font-weight:650;color:var(--navy);background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow-sm)}

/* icons in rows */
.ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ic svg{width:22px;height:22px}
.ic.enf{background:color-mix(in srgb,var(--red) 14%,var(--surface));color:var(--red)}
.ic.enf.solid{background:var(--red);color:#fff}
.ic.clo{background:color-mix(in srgb,var(--a-some) 22%,var(--surface));color:color-mix(in srgb,var(--a-some) 60%,var(--ink))}
.ic.av{background:color-mix(in srgb,var(--lc) 16%,var(--surface));color:var(--lc)}
.ic.quiet{background:color-mix(in srgb,var(--a-plenty) 14%,var(--surface));color:var(--a-plenty)}
.ic.car{background:var(--brand-navy);color:#fff}
.row-main{display:flex;flex-direction:column;min-width:0;flex:1}
.row-t{font-weight:700;font-size:0.8824rem;line-height:1.25}
.row-s{font-size:0.7941rem;color:var(--muted);line-height:1.35}
.row-s b{color:var(--ink);font-weight:650}
.chev{flex:none;width:18px;height:18px;color:var(--muted)}

/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:74%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(15,27,46,.18);padding:6px 18px 18px;z-index:4;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sh-head h2{margin:0;font-size:1.1765rem;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.sh-head p{margin:2px 0 0;color:var(--muted);font-size:0.8235rem}
.x{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.x svg{width:18px;height:18px}
.zs{flex:none;width:16px;height:16px;border-radius:5px;background:var(--zc);display:inline-block;box-shadow:inset 0 0 0 1px rgba(15,27,46,.22)}
.zs.ol{background:transparent;box-shadow:inset 0 0 0 3.5px var(--zc)}
.zs.big{width:40px;height:40px;border-radius:11px}
.zs.big.ol{box-shadow:inset 0 0 0 6px var(--zc)}
.ob-area{margin-top:14px}
.ob-area .lbl{font-size:0.8235rem;font-weight:650;color:#fff;margin-bottom:8px}
.ob-area .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:#fff}
.ob-area .chip[aria-pressed="true"]{background:rgba(255,255,255,.18);border-color:#fff}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:0.7647rem;font-weight:650;padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.tag.yes{background:color-mix(in srgb,var(--a-plenty) 14%,var(--surface));border-color:color-mix(in srgb,var(--a-plenty) 35%,transparent);color:color-mix(in srgb,var(--a-plenty) 70%,var(--ink))}
.tag.pay{background:color-mix(in srgb,var(--z-vis) 16%,var(--surface));border-color:color-mix(in srgb,var(--z-vis) 40%,transparent);color:color-mix(in srgb,var(--z-vis) 55%,var(--ink))}
.tag.no{color:var(--muted)}
.blk{border-top:1px solid var(--line);padding:14px 0 2px;margin-top:14px}
.blk h3{margin:0 0 8px;font-size:0.7941rem;font-weight:700;color:var(--muted)}
.avail-now{display:flex;align-items:center;gap:12px}
.avail-now .big{font-size:1.2941rem;font-weight:800;letter-spacing:-.01em;color:var(--lt, var(--lc))}
.dot{flex:none;width:14px;height:14px;border-radius:50%}
.dot.rep{background:var(--lc)}
.dot.est{background:transparent;border:3px solid var(--lc)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.levels button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:0.8235rem;display:flex;align-items:center;justify-content:center;gap:6px}
.levels button i{width:9px;height:9px;border-radius:50%;background:var(--lc)}
.levels button:hover{border-color:var(--lc)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.btn{min-height:48px;border-radius:14px;padding:6px 12px;white-space:normal;line-height:1.2;font-weight:700;font-size:0.8824rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;text-align:center}
.btn svg{width:18px;height:18px}
.btn.red{background:var(--red-fill);color:var(--on-red)}
.btn.red:active{background:var(--red-press)}
.btn.navy{background:var(--navy);color:var(--on-navy)}
.btn.line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{min-height:54px;font-size:0.9412rem;border-radius:16px}
.bt-chart{display:flex;align-items:flex-end;gap:4px;margin-top:12px;height:122px}
.bt-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.bt-v{font-size:0.6176rem;font-weight:650;color:var(--ink);line-height:1.2}
.bt-bar{display:block;width:100%;border-radius:4px}
.bt-col.best .bt-bar{outline:2px solid var(--ink);outline-offset:1px}
.bt-h{font-size:0.6176rem;color:var(--muted);line-height:1.2}
.bt-col.now .bt-h{color:var(--ink);font-weight:800;text-decoration:underline}
.acct-err{margin:10px 0 0;font-size:0.7941rem;font-weight:650;color:var(--a-full-t)}
.acct-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acct-links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.acct-links button{font-size:0.7941rem;font-weight:650;color:var(--link);min-height:32px;padding:4px 0}
.acctform .field input{margin-top:0}
.plusbadge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--navy);color:var(--on-navy);font-size:0.6471rem;font-weight:800;letter-spacing:.03em;vertical-align:1px}
.fullq{background:var(--surface-2);border-radius:14px;padding:14px;margin-bottom:14px}
.fullq-links{display:flex;justify-content:space-between;margin-top:10px}
.fullq-links button{font-size:0.7941rem;font-weight:650;color:var(--link);padding:6px 0;min-height:32px}
.modrow{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
.modrow button{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:0.7941rem;font-weight:650;color:var(--link)}
.modbox{background:var(--surface-2);border-radius:14px;padding:14px;margin-top:8px;display:grid;gap:8px}
.modbox .actions{margin-top:0}
.row .unb{flex:none;min-height:44px;padding:0 4px;font-size:0.7941rem;font-weight:700;color:var(--link)}
.leaveopts{display:grid;gap:8px}
.leaveopts button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.leaveopts button i{width:12px;height:12px;border-radius:50%;background:var(--lc);flex:none}
.leaveopts button:hover{border-color:var(--lc)}
.leaveopts button:disabled{opacity:.6;cursor:progress}
.hallq{display:block;width:100%;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:0.9412rem;outline:none;-webkit-appearance:none;appearance:none;color:var(--ink)}
.hallq::placeholder{color:var(--muted);opacity:1}
.hallq:focus{border-color:var(--focus);background:var(--surface)}
.halllist{margin-top:8px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.hallrow{display:block;width:100%;text-align:left;padding:8px 12px;min-height:46px;border-bottom:1px solid var(--line)}
.hallrow:last-child{border-bottom:0}
.hallgrp{padding:10px 12px 4px;font-size:0.6765rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.hallpin{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:40px;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;font-size:0.8235rem;font-weight:650;color:var(--link)}
.hallpin svg{flex:none}
.hallrow .row-t,.hallrow .row-s{display:block}
.hallrow:hover{background:var(--surface-2)}
.hallsel{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:54px;padding:6px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.hallsel .hs-ic{width:22px;height:22px;flex:none;color:var(--link)}
.hallsel .hs-ic svg{width:22px;height:22px}
.hallsel .row-main{flex:1;min-width:0}
.hallsel .row-t,.hallsel .row-s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hallsel .hs-chg{font-size:0.7941rem;font-weight:650;color:var(--link)}
.fine{font-size:0.7353rem;color:var(--muted);text-align:center;margin:12px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:0.8235rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:0.7647rem;font-weight:650;color:var(--muted);margin-bottom:6px}
.field input{width:100%;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:0.9412rem;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus{border-color:var(--focus);background:var(--surface)}
.loc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.loc svg{width:20px;height:20px;color:var(--red);flex:none}
.loc .row-main{flex:1}
.linkbtn{font-size:0.7941rem;font-weight:700;color:var(--navy);padding:6px 2px;white-space:nowrap}
:root[data-theme="dark"] .linkbtn{color:#8FB3FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .linkbtn{color:#8FB3FF}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px}
.seg button{min-height:36px;border-radius:10px;font-weight:650;font-size:0.8235rem;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--navy);color:var(--on-navy);box-shadow:var(--shadow-sm)}
.detail{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.note{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:0.8235rem}
.seen{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:0.8235rem;color:var(--muted)}
.seen b{color:var(--ink)}
.summary{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--brand-navy);color:#fff;margin-bottom:12px}
.summary .row-s{color:rgba(255,255,255,.72)}
.summary .mins{font-size:1.5294rem;font-weight:850;font-stretch:108%;line-height:1;text-align:center;min-width:56px}
.summary .mins small{display:block;font-size:0.6765rem;font-weight:600;opacity:.75;font-stretch:100%}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.opt + .opt{margin-top:8px}
.opt[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.opt .w{margin-left:auto;text-align:right;font-weight:750;white-space:nowrap}
.opt .w small{display:block;font-weight:500;color:var(--muted);font-size:0.7353rem}
/* trip planner */
.chiprow{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{flex:none}
.pl-row{display:flex;gap:16px;align-items:flex-start;margin-top:12px}
.pl-row .field{margin-top:0}
.field input.pl-time{width:auto;min-height:36px;padding:0 10px;border-radius:10px;font-size:0.9412rem}
.stepper{display:inline-flex;align-items:center;min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.stepper button{width:38px;min-height:36px;font-size:1.0588rem;font-weight:700}
.stepper b{min-width:62px;text-align:center;font-size:0.8235rem;font-weight:650}
.dayrow{display:flex;gap:6px;margin-top:12px}
.dayrow .chip{flex:1;justify-content:center;padding:0;min-width:0}
.plan-card{margin-top:16px;padding:14px;border-radius:14px;background:var(--brand-navy);color:#fff}
.plan-card .pc-s{font-size:0.7941rem;font-weight:600;opacity:.8}
.plan-card .pc-b{font-size:1.6471rem;font-weight:850;font-stretch:108%;line-height:1.15;margin:4px 0}
.plan-card .pc-p{font-size:0.8824rem;font-weight:650}
.plan-card .pc-m{font-size:0.7941rem;opacity:.8;margin-top:6px}
.cbar{height:7px;border-radius:99px;background:rgba(255,255,255,.22);margin:8px 0 2px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:99px;background:var(--cc)}
.pl-basis{font-size:0.7353rem;color:var(--muted);margin:8px 0 0}
.pl-early{display:flex;gap:10px;align-items:center;margin-top:10px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:0.8235rem;font-weight:600}
.pl-early svg{flex:none;width:20px;height:20px;color:var(--a-plenty)}
.badge{flex:none;min-width:52px;padding:0 6px;min-height:30px;border-radius:9px;background:var(--cc);color:var(--on-lv);font-weight:800;font-size:0.8235rem;display:inline-flex;align-items:center;justify-content:center}
.pl-h{margin:16px 0 8px;font-size:0.7941rem;color:var(--muted);font-weight:700}
.ic.nav{background:var(--navy);color:#fff}
a.row{text-decoration:none;color:inherit}
/* consent banner */
#consent{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#consent[hidden]{display:none}
#sheet:focus{outline:none}
.consent-card{pointer-events:auto;width:100%;max-width:520px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;max-height:calc(100dvh - 24px);overflow:auto}
.consent-card h2{margin:0 0 6px;font-size:1rem;font-weight:800;letter-spacing:-.01em}
.consent-card p{margin:6px 0;font-size:0.8235rem;line-height:1.45;color:var(--muted)}
.consent-card p b{color:var(--ink);font-weight:650}
.consent-card a{color:var(--link);font-weight:600}
.consent-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.consent-btns .btn{width:100%}
.btn.ghost{background:var(--surface);border-color:var(--navy);color:var(--navy)}
:root[data-theme="dark"] .btn.ghost{border-color:#8FB3FF;color:#8FB3FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{border-color:#8FB3FF;color:#8FB3FF}}

/* panels */
.pn{padding:18px 16px 28px}
.pn h1{margin:0 0 14px;font-size:1.5294rem;font-weight:850;letter-spacing:-.02em;font-stretch:104%}
.pn .seg{margin-bottom:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--surface)}
.row + .row{border-top:1px solid var(--line)}
button.row:hover{background:var(--surface-2)}
.cap{font-size:0.7353rem;color:var(--muted);margin:10px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cap span{display:inline-flex;align-items:center;gap:6px}
.cap .dot{width:11px;height:11px}
.cap .dot.est{border-width:2.5px}
.empty{text-align:center;padding:30px 20px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.empty .ic{margin:0 auto 10px;width:52px;height:52px}
.empty h2{margin:0 0 4px;font-size:1rem}
.empty p{margin:0 0 14px;color:var(--muted);font-size:0.8235rem}
.sect{margin-top:22px}
.sect > h2{font-size:0.8235rem;font-weight:700;color:var(--muted);margin:0 4px 8px}
.me-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.av-img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--brand-navy)}
.av-ini{width:56px;height:56px;border-radius:50%;flex:none;background:var(--brand-navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.1765rem}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--navy)}
.radio.on::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--navy)}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--a-plenty)}
.switch.on::after{transform:translateX(20px)}
.inrow{padding:13px 14px;background:var(--surface)}
.inrow + .row,.row + .inrow{border-top:1px solid var(--line)}
.inrow .field{margin-top:0}
.plus{margin-top:22px;border-radius:20px;background:var(--brand-navy);color:#fff;padding:20px;position:relative;overflow:hidden}
.plus::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 1.5px,transparent 1.5px 26px)}
.plus h2{margin:0;font-size:1.4118rem;font-weight:850;font-stretch:112%;letter-spacing:-.02em;position:relative}
.plus h2 span{color:#FF5C6C}
.plus p{margin:4px 0 12px;color:rgba(255,255,255,.75);font-size:0.8235rem;position:relative}
.plus ul{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px;position:relative}
.plus li{display:flex;gap:10px;align-items:center;font-size:0.8529rem}

    if (m[1] === 'Z') { if (cur.length >= 3) polys.push(cur); cur = []; continue; }

  let list = LOTS.map(l => ({ lot:l, ok:permitStatus(l), st:lotStatus(l), crow:dist(center(l), dest) }));
  const allowed = list.filter(o => o.ok !== 'no');
  if (allowed.length) list = allowed;
  list = list.sort((a, b) => a.crow - b.crow).slice(0, 14);   // only route the closest candidates
  for (const o of list) o.route = route(center(o.lot), dest);
  const okRank = { yes:0, pay:1, no:2 };
  return list.sort((a, b) => (okRank[a.ok] - okRank[b.ok]) || ((a.st.level === 'full') - (b.st.level === 'full')) || (a.route.d - b.route.d)).slice(0, 8);
}

/* "Best times to arrive": the usual chance of a spot in a lot at each hour of a weekday, from the same reports and the same model the

/* toast + banner */
/* ---------------- your location (only while the page is open) ---------------- */
let locWatch = null;
const LOC_OFF = 'Location is off for this site. Allow it in your browser or in iPhone Settings > Privacy & Security > Location Services.';
const onCampusPx = (x, y) => x >= -60 && y >= -60 && x <= MAP_W + 60 && y <= MAP_H + 60;
const locOnCampus = () => !!(S.loc && onCampusPx(S.loc.x, S.loc.y));
/* "I'm parked here": pins the car to your exact reading, never to the middle of a lot. It waits for a fresh reading within
   CAR_GOOD_M; after CAR_WAIT_MS it saves the best one it got (up to CAR_FLOOR_M) and says so, or sends you to the map. */
const LOT_DETECT_M = 30, CAR_GOOD_M = 15, CAR_FLOOR_M = 50, CAR_WAIT_MS = 8000, PARK_QUIET_MS = 3 * 3600000;
const M_PER_PX = 1609.344 / U_PER_MI;
/* "How full was it?" right after "I'm parked here". Parking is the moment you know how full a lot was, so one tap here turns every

const FULL_QUIET_MS = 10 * 60000, FULL_WINDOW_MS = 15 * 60000;   // skip if someone just reported it; stop offering after 15 minutes
const askFullOn = () => lsGet('pr.askFull', true) !== false;
const setAskFull = on => { try { if (on) localStorage.removeItem('pr.askFull'); else localStorage.setItem('pr.askFull', 'false'); } catch {} };
const fullQuestionLot = () => { const a = S.fullAsk; return a && Date.now() - a.at < FULL_WINDOW_MS ? LOT_BY[a.lot] : null; };
function fullPrompt(l) {
  return `<div class="fullq" role="group" aria-labelledby="fullqT"><div class="row-t" id="fullqT">How full was ${esc(l.name)} when you arrived?</div>
    <p class="row-s" style="margin:4px 0 10px">One tap shares it with other students. Your name is never attached.</p>
    <div class="levels">${Object.entries(LEVELS).map(([k, v]) => `<button data-act="fullAnswer" data-v="${k}" style="--lc:${v.color}" aria-label="Mark ${esc(l.name)} as ${v.label}"><i></i>${v.short}</button>`).join('')}</div>
    <div class="fullq-links"><button data-act="fullSkip">Not now</button><button data-act="fullNever">Don't ask me this</button></div></div>`;
}
function lotUnderMe() {   // the lot you are standing in, if your device has a close reading from this visit
  const l = S.loc;
  if (!l || l.stale || !(l.acc <= LOT_DETECT_M)) return null;
  return lotAt(l.x, l.y);
}
/* Offered while you stand in a lot. Not while a spot saved in the last few hours is still on the map, so walking through
   a lot on the way to class never asks you to move your car. "Update to my location" and the lot's page still work. */
function parkPrompt() {
  const lot = lotUnderMe(); if (!lot) return null;
  const c = S.profile.car;
  return c && Date.now() - c.at < PARK_QUIET_MS ? null : lot;
}
/* "I'm leaving now": once you are back in the lot your saved car is in, one button frees the spot, and it will not go through
   until you say how full the lot is. Leaving is the moment you know what the next student will find. Same rules as the iPhone app. */
const LEAVE_QUIET_MS = 10 * 60000, LEAVE_NEAR_M = 40;   // hidden for 10 minutes after saving the car; or within 40 m of it when the lot can't be told
const LEAVE_HINTS = { plenty:'Lots of open spots', some:'A fair number are open', few:'Only a few are open', full:'Nothing is open' };
function leavePrompt() {
  const c = S.profile.car, lot = c && c.lot ? LOT_BY[c.lot] : null, l = S.loc;
  if (!lot || !l || l.stale || !(l.acc <= LOT_DETECT_M) || Date.now() - c.at < LEAVE_QUIET_MS) return null;
  const u = lotAt(l.x, l.y);
  if (u && u.id === lot.id) return lot;
  return dist(l, c) * M_PER_PX <= LEAVE_NEAR_M ? lot : null;
}
function sheetLeaving() {
  const c = S.profile.car, l = c && c.lot ? LOT_BY[c.lot] : null;
  if (!l) return sheetHead('Leaving?', '') + '<p class="row-s" style="margin:0">Save where you parked first, then this button frees the spot.</p>';
  return sheetHead(`Leaving ${esc(l.name)}?`, 'How full is it right now?', `<span class="ic car">${I.car}</span>`)
    + `<p class="row-s" style="margin:0 0 12px">Look around before you go. Your answer tells the next student what to expect, and it frees your saved spot. Your name is never attached.</p>`
    + `<div class="leaveopts" role="group" aria-label="How full is ${esc(l.name)}?">${Object.entries(LEVELS).map(([k, v]) => `<button data-act="leaveAnswer" data-v="${k}" style="--lc:${v.color}"${S.leaveBusy ? ' disabled' : ''} aria-label="${esc(l.name)} is ${v.label}. ${LEAVE_HINTS[k]}. Sends your answer and frees your saved spot."><i></i><span><span class="row-t" style="display:block">${v.label}</span><span class="row-s" style="display:block">${LEAVE_HINTS[k]}</span></span></button>`).join('')}</div>`
    + `<button class="btn quiet full" style="margin-top:12px" data-act="closeSheet">Not leaving yet</button>`;
}
function carIsHere(l) {   // your saved car is already in this lot, and you are not standing somewhere else in it
  const c = S.profile.car;
  if (!c || c.lot !== l.id) return false;
  const u = lotUnderMe();
  return !(u && u.id === l.id && dist(S.loc, c) * M_PER_PX > 25);
}
const distToCar = () => (S.loc && S.profile.car && locOnCampus()) ? dist(S.loc, S.profile.car) : null;
function startLocate() {
  if (locWatch !== null) return;
  if (!navigator.geolocation) { S.locPending = null; toast("This browser can't share your location."); return; }
  locWatch = navigator.geolocation.watchPosition(pos => {
    const p = lngLatToPx(pos.coords.longitude, pos.coords.latitude);
    S.loc = { x: p.x, y: p.y, acc: pos.coords.accuracy, at: Date.now() };

    const here = (lotUnderMe() || {}).id || '';
    if (S.sheet && S.sheet.type === 'lot' && here !== S.standKey) renderSheet();   // "I'm parked here" vs "I parked here"
    S.standKey = here;

    if (pend === 'center') centerOnMe();
    else if (pend === 'walkFit') fitWalk();
  }, err => {
    stopLocate();

    const denied = err && err.code === 1; S.locPending = null;
    if (denied) { lsSet('pr.locOn', false); toast(LOC_OFF); } else toast("Couldn't find your location. Try again outdoors.");
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
function stopLocate() {

}
function renderMe() {

function centerOnMe() {

}
function locateMe() {

}
function startCarPick() { S.tab = 'map'; S.sheet = null; S.walk = null; S.zoneFocus = null; S.pick = 'car'; S.carMenu = false; render(); }
let carFix = null;   // { watch, timer, best } while "I'm parked here" waits for a close reading
function endCarFix() {
  if (!carFix) return;
  navigator.geolocation.clearWatch(carFix.watch); clearTimeout(carFix.timer);
  carFix = null; S.carFinding = false; renderMapUI();
}
function finishCarFix(pos) {

  if (!onCampusPx(p.x, p.y)) { toast("You don't seem to be on campus. Tap the map to place your car."); startCarPick(); return; }

function saveCarHere() {
  S.carMenu = false;
  if (!navigator.geolocation) { toast("This browser can't share your location."); startCarPick(); return; }
  if (carFix) return;
  const fix = carFix = { best: null };
  S.carFinding = true; toast('Finding your exact spot…'); renderMapUI();
  // A fresh reading (maximumAge 0), not the last one the page happened to have.
  fix.watch = navigator.geolocation.watchPosition(pos => {
    if (carFix !== fix) return;
    if (!fix.best || pos.coords.accuracy < fix.best.coords.accuracy) fix.best = pos;
    if (fix.best.coords.accuracy <= CAR_GOOD_M) finishCarFix(fix.best);

}

/* car */
function setCar(x, y, o = {}) {   // o.acc: the GPS reading's accuracy in meters (only when the spot came from your location); o.lot: lot id when already known
  const lot = o.lot !== undefined ? o.lot : (lotAt(x, y) || {}).id;
  const car = { v:MAP_V, x, y, lot: lot || null, at: Date.now(), remindAt: null, remindMins: 0 };
  if (o.acc != null) car.acc = Math.round(o.acc);
  S.profile.car = car;
  S.fullAsk = null;
  if (o.acc != null && car.lot && askFullOn()) {   // only when the spot came from your device's location, so you are actually there
    const d = lotRec(car.lot);
    if (!(d && Date.now() - d.at < FULL_QUIET_MS)) S.fullAsk = { lot: car.lot, at: Date.now() };
  }

  toast(o.acc == null ? 'Spot saved. We\'ll flag enforcement near your car.'
    : o.acc <= CAR_GOOD_M ? 'Pinned to your exact spot. We\'ll flag enforcement near your car.'

function startReport() {
  if (S.readOnly) { toast('Posting is off for your access level.'); return; }
  hideSearch();
  const c = S.profile.car, s = mapSize(), k = kpx();
  let x, y;
  if (c) { x = c.x; y = c.y; }
  else { const p = toSvg(s.left + s.w/2, s.top + s.h * .35); x = clamp(p.x, 60, MAP_W - 60); y = clamp(p.y, 60, MAP_H - 60); }
  S.draft = { kind:'enforcement', x, y, vehicle:'', plate:'', note:'', dur:60 };
  S.pick = 'report';
  openSheet({ type:'newReport' });
  requestAnimationFrame(() => focusPoint(x, y, clamp(vb.w, 640, 1400)));
}
async function submitReport() {
  const d = S.draft; if (!d) return;
  const now = Date.now();
  d.x = clamp(d.x, 0, MAP_W); d.y = clamp(d.y, 0, MAP_H);
  const place = describe(d.x, d.y).place;
  if (d.kind === 'closure') {
    if (!d.note.trim()) { toast('Add a short description of what\'s closed.'); $('[data-draft="note"]')?.focus(); return; }
    let until;
    if (d.dur === 'day') { const e = new Date(); e.setHours(23, 59, 0, 0); until = e.getTime(); }
    else until = now + Number(d.dur) * MIN;
    if (textIsObjectionable(d.note)) { toast(FILTER_MSG); return; }
    const ok = await addReport({ kind:'closure', x:d.x, y:d.y, place:place.id, note:d.note.trim().slice(0, 80), at:now, until, by:myKey(), confirms:{}, gone:{} });
    if (ok) { toast(ok === 'queued' ? QUEUED_MSG : 'Closure posted.'); closeSheet(); }
    return;
  }
  if (textIsObjectionable(d.note) || textIsObjectionable(d.plate)) { toast(FILTER_MSG); return; }
  const ok = await addReport({ kind:'enforcement', x:d.x, y:d.y, place:place.id, vehicle:d.vehicle || '', plate:d.plate.trim().slice(0, 12), note:d.note.trim().slice(0, 120), at:now, by:myKey(), confirms:{}, gone:{} });
  if (ok) { toast(ok === 'queued' ? QUEUED_MSG : 'Report posted. Thanks for looking out.'); closeSheet(); }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) { if (!e.target.closest('#searchRes') && e.target.id !== 'q') hideSearch(); return; }
  const act = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  if (act !== 'searchPick') hideSearch();
  if (S.mapMenu && act !== 'mapMenu' && act !== 'mapMode') { S.mapMenu = false; renderMapUI(); }
  if (S.carMenu && act !== 'carChoose' && act !== 'carHere' && act !== 'carPick') { S.carMenu = false; renderMapUI(); }

    case 'tab':
      S.tab = v; S.sheet = null; S.pick = null; S.walk = null; S.draft = null; S.zoneFocus = null;

      break;
    case 'zoomIn': animateTo(zoomBy(1/1.6)); break;

    }

      const c = center(l); setCar(c.x, c.y, { lot: l.id }); break;
    }
    case 'walkFrom': S.walk = { from:null, lot:id, fixed:true, dest:null }; S.hallChanging = false; S.hallQ = ''; openSheet({ type:'walk' }); break;
    case 'walkTo': S.walk = { from:null, lot:null, dest:null, fromMe:true }; S.hallChanging = false; S.hallQ = ''; openSheet({ type:'walk' }); prepareWalkFromMe(); break;
    case 'walkStart': S.walk.fromMe = v === 'me'; renderSheet(); renderMapDyn(); if (S.walk.fromMe) prepareWalkFromMe(); else fitWalk(); break;
    case 'planWalk': S.walk = { from:null, lot:null, dest:null }; S.hallChanging = false; S.hallQ = ''; openSheet({ type:'walk' }); break;
    case 'carWalk': S.walk = { from:'car', dest:null }; S.hallChanging = false; S.hallQ = ''; openSheet({ type:'walk' }); break;
    case 'walkAll': S.walk.lot = null; S.walk.fixed = false; renderSheet(); renderMapDyn(); fitWalk(); break;
    case 'walkDest':

      if (v === 'pt') { S.pick = 'dest'; renderSheet(); renderMapUI(); break; }
      S.pick = null; S.walk.dest = v; renderSheet(); renderMapDyn(); renderMapUI(); fitWalk(); break;
    case 'walkPick': S.walk.lot = id; renderSheet(); renderMapDyn(); fitWalk(); { const s = $('#sheet'); s.scrollTop = 0; } break;
    case 'deleteData': if (acctUser()) acctOpen('delete'); else deleteMyData(); break;
    case 'acctOpen': acctOpen(v); break;
    case 'acctCancel': S.acct = null; renderPanel(); break;
    case 'acctLogOut': acctLogOut(); break;
    case 'consentYes': setConsent(true); break;
    case 'consentNo': setConsent(false); break;
    case 'consentOpen': S.consentOpen = true; renderConsent(); break;
    case 'planTrip': S.planPicked = null; S.hallChanging = false; S.hallQ = ''; openSheet({ type:'plan' }); fitPlan(); refreshHistory(); break;
    case 'planDest': S.plan.dest = v; S.hallChanging = false; S.hallQ = ''; S.planPicked = null; savePlan(); renderSheet(); renderMapDyn(); fitPlan(); break;
    case 'hallChange': S.hallChanging = true; S.hallQ = ''; renderSheet(); requestAnimationFrame(() => { const i = $('.hallq'); if (i) i.focus(); }); break;
    case 'btGroup': S.btGroup = Number(v); renderSheet(); break;

    case 'driveEst': estimateDrive(); break;
    case 'planDrive': S.driveNote = ''; S.plan.drive = clamp(S.plan.drive + Number(v), 0, 90); savePlan(); renderSheet(); break;
    case 'planPick': S.planPicked = id; renderSheet(); renderMapDyn(); fitPlan(); break;
    case 'planRoute': {
      const r = S.plan.dest && planResult(); if (!r || !r.selected) break;
      S.walk = { from:null, lot:r.selected.lot.id, fixed:false, dest:r.dest.id }; openSheet({ type:'walk' }); fitWalk(); break;
    }
    case 'openCar': openSheet({ type:'car' }); requestAnimationFrame(() => S.profile.car && focusPoint(S.profile.car.x, S.profile.car.y, 640)); break;
    case 'carPick': startCarPick(); break;
    case 'carChoose': if (S.profile.car) openSheet({ type:'car' }); else { S.carMenu = !S.carMenu; renderMapUI(); } break;
    case 'carHere': saveCarHere(); break;
    case 'share': {
      const data = { title:'ParkRadar', text:'ParkRadar shows where students just spotted parking enforcement and which campus lots have room.', url:'https://parkradarapp.com/' };
      if (navigator.share) { try { await navigator.share(data); } catch {} }
      else { try { await navigator.clipboard.writeText(data.url); toast('Link copied. Paste it to a friend.'); } catch { toast(data.url); } }
      break;
    }
    case 'annOpen': openSheet({ type:'announcement', id }); break;
    case 'annDismiss': dismissAnnouncement(id); break;
    case 'parkNow': S.hallChanging = false; S.hallQ = ''; openSheet({ type:'parkNow' }); if (!S.loc) startLocate(); break;
    case 'parkDest': S.parkDest = v; S.hallChanging = false; S.hallQ = ''; renderSheet(); break;
    case 'parkAnywhere': S.parkDest = null; S.hallChanging = false; renderSheet(); break;
    case 'driveOpen': S.driveMenu = S.driveMenu === id ? null : id; renderSheet(); break;
    case 'flagOpen': S.modUI = S.modUI && S.modUI.id === id && S.modUI.mode === 'flag' ? null : { id, mode:'flag' }; renderSheet(); break;
    case 'blockOpen': S.modUI = S.modUI && S.modUI.id === id && S.modUI.mode === 'block' ? null : { id, mode:'block' }; renderSheet(); break;
    case 'modClose': S.modUI = null; renderSheet(); break;
    case 'flagPick': await flagReport(id, v); break;
    case 'blockDo': blockAuthor(id); break;
    case 'unblockAll': unblockAll(); break;
    case 'leaveStart': if (S.profile.car && S.profile.car.lot) openSheet({ type:'leaving' }); break;
    case 'leaveAnswer': {
      const c = S.profile.car, l = c && c.lot ? LOT_BY[c.lot] : null;
      if (!l || S.leaveBusy || !LEVELS[v]) break;
      S.leaveBusy = true; renderSheet();
      const ok = await setLotLevel(l.id, v);
      S.leaveBusy = false;
      if (ok) { S.fullAsk = null; S.profile.car = null; saveProfile(); closeSheet(); toast(ok === 'queued' ? QUEUED_MSG + ' Drive safe.' : `Thanks. ${l.name} marked as ${LEVELS[v].label.toLowerCase()}. Drive safe.`); }
      else renderSheet();
      break;
    }
    case 'locate': locateMe(); break;
    case 'walkToCar': walkToCar(); break;
    case 'rHere': if (locOnCampus()) { S.draft.x = S.loc.x; S.draft.y = S.loc.y; renderPins(); const el = $('#draftLoc'); if (el) el.textContent = describe(S.loc.x, S.loc.y).text; } break;
    case 'cancelPick': S.pick = null; render(); break;
    case 'fullAnswer': {
      const l = fullQuestionLot(); if (!l) break;
      const ok = await setLotLevel(l.id, v);
      if (ok) { S.fullAsk = null; toast(ok === 'queued' ? QUEUED_MSG : `Thanks. ${l.name} marked as ${LEVELS[v].label.toLowerCase()}.`); renderSheet(); }
      break;
    }
    case 'fullSkip': S.fullAsk = null; renderSheet(); break;
    case 'fullNever': S.fullAsk = null; setAskFull(false); toast('Okay. You can turn this back on in the Me tab.'); renderSheet(); break;
    case 'toggleAskFull': setAskFull(!askFullOn()); renderPanel(); break;
    case 'carRemove': S.fullAsk = null; S.profile.car = null; saveProfile(); closeSheet(); toast('Saved spot removed.'); break;
    case 'carRemind': {
      const c = S.profile.car; if (!c) break;
      const m = Number(v); c.remindMins = m; c.remindAt = m ? Date.now() + m * MIN : null; c.warned = false; c.doneAlert = false;
      saveProfile(); renderSheet(); if (m) toast(`Reminder set for ${clock(c.remindAt)}.`); break;
    }
    case 'rkind': S.draft.kind = v; renderSheet(); break;
    case 'rveh': S.draft.vehicle = S.draft.vehicle === v ? '' : v; renderSheet(); break;
    case 'rdur': S.draft.dur = v === 'day' ? 'day' : Number(v); renderSheet(); break;
    case 'rUseCar': { const c = S.profile.car; if (c) { S.draft.x = c.x; S.draft.y = c.y; renderPins(); const el = $('#draftLoc'); if (el) el.textContent = describe(c.x, c.y).text; } break; }
    case 'rSubmit': b.disabled = true; await submitReport(); b.disabled = false; break;
    case 'confirm': {
      const r = S.reports.find(x => x.id === id); if (!r) break;
      if (await stampReport(id, 'confirms')) toast('Thanks. The report stays up another 15 minutes.');
      break;
    }
    case 'gone': {
      const r = S.reports.find(x => x.id === id); if (!r) break;
      if (await stampReport(id, 'gone')) { toast(goneCount(r) + 1 >= 2 ? 'Thanks. The report has been cleared.' : 'Thanks. One more "gone" clears it.'); closeSheet(); }
      break;
    }
    case 'removeMine': if (await deleteReport(id)) { toast('Your report was removed.'); closeSheet(); } break;
    case 'lotsSeg': S.lotsSeg = v; renderPanel(); break;
    case 'lotsFilter': S.lotsFilter = v; renderPanel(); break;
    case 'zonesFilter': S.zonesFilter = v; renderPanel(); break;
    case 'alertsSeg': S.alertsSeg = v; renderPanel(); break;
    case 'zone': {
      S.zoneFocus = v; S.tab = 'map'; S.sheet = { type:'zone', id:v }; S.walk = null; S.pick = null; render();
      requestAnimationFrame(() => {
        const bs = LOTS.filter(l => zoneKey(l) === v).map(bounds);
        if (!bs.length) return fitCampus();
        fitBox(Math.min(...bs.map(b => b[0])), Math.min(...bs.map(b => b[1])), Math.max(...bs.map(b => b[2])), Math.max(...bs.map(b => b[3])), true, 560);
      }); break;
    }
    case 'resArea': S.profile.resArea = v; saveProfile(); render(); break;
    case 'permit': S.profile.permit = v; saveProfile(); render(); break;
    case 'theme': setTheme(v); renderPanel(); break;
    case 'radius': S.profile.radius = Number(v); saveProfile(); renderPanel(); break;
    case 'toggleAlerts': S.profile.alertsOn = !S.profile.alertsOn; saveProfile(); renderPanel(); break;
    case 'waitlist': S.profile.waitlist = !S.profile.waitlist; saveProfile(); renderPanel(); toast(S.profile.waitlist ? "You're on the ParkRadar+ waitlist." : 'Removed from the waitlist.'); break;
    case 'reset':
      if (confirm('Reset your permit, vehicle and saved car?')) { S.profile = { ...DEFAULT_PROFILE }; saveProfile(); S.obStep = 0; S.tab = 'map'; render(); }
      break;
    case 'obNext': S.obStep = 1; S.acct = null; renderOnboard(); break;
    case 'obAcct': S.obStep = 2; acctOpen(v); break;
    case 'obBack': S.obStep = 0; S.acct = null; renderOnboard(); break;
    case 'obDone': S.profile.onboarded = true; saveProfile(); render(); requestAnimationFrame(() => fitStart(false)); if (installTip()) setTimeout(() => toast('Tip: tap Share, then Add to Home Screen to install ParkRadar.'), 900); break;
    case 'installTipX': lsSet('pr.installTipX', true); render(); break;
    case 'bannerX': $('#banner').hidden = true; break;
    case 'bannerGo': {
      $('#banner').hidden = true;
      const i = (v || '').indexOf(':'), t = v.slice(0, i), rid = v.slice(i + 1);
      if (t === 'report') openReport(rid); else if (t === 'carSheet') openSheet({ type:'car' });
      break;
    }
    case 'searchPick': {
      const [t, pid] = v.split(':');
      $('#q').value = ''; S.q = ''; hideSearch(); $('#q').blur();
      if (t === 'lot') openLot(pid); else { S.walk = { from:null, lot:null, dest:pid, fromMe:locOnCampus() }; openSheet({ type:'walk' }); fitWalk(); }
      break;
    }
  }
});
function fitWalk() {
  requestAnimationFrame(() => {
    const wp = walkPlan(); if (!wp) return;
    const xs = wp.route.pts.map(p => p.x), ys = wp.route.pts.map(p => p.y);
    fitBox(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), true, 520);
  });
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.draft && S.draft) S.draft[t.dataset.draft] = t.value;
  if (t.dataset.bind === 'vehicle') { S.profile.vehicle = t.value; }
  if (t.dataset.bind === 'acctEmail' && S.acct) S.acct.email = t.value;
  if (t.dataset.bind === 'acctPw' && S.acct) S.acct.pw = t.value;
  if (t.dataset.bind === 'hallQ') { S.hallQ = t.value; const l = $('#hallList'); if (l) l.innerHTML = hallRows(S.hallQ, t.dataset.mode); }
});
document.addEventListener('submit', e => { if (e.target.dataset && e.target.dataset.form === 'acct') { e.preventDefault(); acctSubmit(); } });
document.addEventListener('change', e => {
  if (e.target.dataset.bind === 'vehicle') { S.profile.vehicle = e.target.value.trim(); saveProfile(); }
  if (e.target.dataset.bind === 'planTime') {
    const [hh, mm] = e.target.value.split(':').map(Number);
    if (Number.isFinite(hh) && Number.isFinite(mm)) { S.plan.minutes = hh * 60 + mm; savePlan(); renderSheet(); renderMapDyn(); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet && !isTyping()) closeSheet();
  if (e.key === 'Enter' && e.target.dataset.draft) { e.preventDefault(); submitReport(); }
});

/* ---------------- timers ---------------- */
function checkReminder() {
  const c = S.profile.car; if (!c || !c.remindAt) return;
  const left = c.remindAt - S.now;
  if (left <= 0 && !c.doneAlert) {
    c.doneAlert = true; c.warned = true; saveProfile();
    banner('Your parking time is up', `Your time at ${carPlaceText()} ended at ${clock(c.remindAt)}.`, 'carSheet', true);
  } else if (left > 0 && left <= 10 * MIN && !c.warned) {
    c.warned = true; saveProfile();
    banner('10 minutes left', `Your time at ${carPlaceText()} ends at ${clock(c.remindAt)}.`, 'carSheet', true);
  }
}
setInterval(() => { S.now = Date.now(); checkReminder(); refreshLive(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S.now = Date.now(); checkReminder(); refreshLive(); } });

/* ---------------- boot ---------------- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => $('#map').addEventListener(t, e => e.preventDefault()));
document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) window.scrollTo(0, 0);
}, 60));
/* The panel, sheet and map card are rebuilt whenever data changes (every few seconds). A rebuild drops keyboard focus,
   so remember which control had it and give it back to the same control afterwards. */
function keepFocus(fn) {
  const a = document.activeElement;
  let sel = null;
  if (a && a !== document.body && a.dataset && a.dataset.act && a.closest('#panel, #sheet, #mapUI')) {
    sel = `[data-act="${a.dataset.act}"]` + (a.dataset.id ? `[data-id="${CSS.escape(a.dataset.id)}"]` : '') + (a.dataset.v !== undefined ? `[data-v="${CSS.escape(a.dataset.v)}"]` : '');
  }
  const r = fn();
  if (sel && (!document.activeElement || document.activeElement === document.body)) { const n = document.querySelector(sel); if (n) n.focus({ preventScroll:true }); }   // only when the rebuild dropped focus
  return r;
}
{ const rp = renderPanel, rs = renderSheet, rm = renderMapUI;
  renderPanel = (...a) => keepFocus(() => rp(...a));
  renderSheet = (...a) => keepFocus(() => rs(...a));
  renderMapUI = (...a) => keepFocus(() => rm(...a)); }
drawBase();
render();
renderConsent();
requestAnimationFrame(() => fitStart(false));
applyMapMode();
initRuntime();
})();
</script>
</body>
