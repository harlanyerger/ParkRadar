<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13274A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Map picture: the biggest thing on screen, so fetch it first. Keep this address identical to the map <image> href below. -->
<link rel="preload" as="image" href="/.netlify/images?url=/map.webp" fetchpriority="high">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ParkRadar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ParkRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --brand-navy:#13274A;
  --bg:#E8ECF2; --surface:#FFFFFF; --surface-2:#F3F5F9; --ink:#0F1B2E; --muted:#56657B; --line:#DCE2EA;
  --navy:#14284B; --navy-2:#20406F; --on-navy:#FFFFFF;
  --red:#D62839; --red-press:#B61E2E; --on-red:#FFFFFF;
  --a-plenty:#1C9A54; --a-some:#D99A12; --a-few:#E5631F; --a-full:#D62839;
  --z-blue:#3A7FC4; --z-red:#B02A3E; --z-res:#2C9B55; --z-fac:#F2F2F2; --z-vis:#285ADF; --z-pay:#E6322A;
  --land:#EFF0EC; --block:#E1E5DD; --bldg:#D2D7DE; --bldg-line:#BAC2CC; --green:#CAE1BB; --green-2:#A9CD92;
  --road:#FFFFFF; --casing:#D0D6DE; --water:#B6D3EE; --label:#3F4E63; --halo:#F1F2EE; --stall:rgba(255,255,255,.6);
  --lot-fill:.30;
  --focus:#2F6BE0;
  --shadow:0 10px 30px rgba(15,27,46,.16),0 1px 3px rgba(15,27,46,.08);
  --shadow-sm:0 2px 8px rgba(15,27,46,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09111E; --surface:#101B2C; --surface-2:#162337; --ink:#E8EDF5; --muted:#99A7BC; --line:#233249;
    --navy:#2B4F8C; --navy-2:#3862A6; --red:#EA3D50; --red-press:#CF2E41;
    --a-plenty:#2DB36A; --a-some:#E8AE2A; --a-few:#F07A3A; --a-full:#EA3D50;
    --z-blue:#4A8FD6; --z-red:#C7384C; --z-res:#3DB56A; --z-fac:#F2F2F2; --z-vis:#4A78F0; --z-pay:#EE4A40;
    --land:#131E2E; --block:#172437; --bldg:#24334A; --bldg-line:#33445E; --green:#1B372A; --green-2:#264E39;
    --road:#29394F; --casing:#0C1522; --water:#193857; --label:#B2BFD0; --halo:#131E2E; --stall:rgba(255,255,255,.14);
    --lot-fill:.38; --focus:#7AA5FF;
    --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#09111E; --surface:#101B2C; --surface-2:#162337; --ink:#E8EDF5; --muted:#99A7BC; --line:#233249;
  --navy:#2B4F8C; --navy-2:#3862A6; --red:#EA3D50; --red-press:#CF2E41;
  --a-plenty:#2DB36A; --a-some:#E8AE2A; --a-few:#F07A3A; --a-full:#EA3D50;
  --z-blue:#4A8FD6; --z-red:#C7384C; --z-res:#3DB56A; --z-fac:#F2F2F2; --z-vis:#4A78F0; --z-pay:#EE4A40;
  --land:#131E2E; --block:#172437; --bldg:#24334A; --bldg-line:#33445E; --green:#1B372A; --green-2:#264E39;
  --road:#29394F; --casing:#0C1522; --water:#193857; --label:#B2BFD0; --halo:#131E2E; --stall:rgba(255,255,255,.14);
  --lot-fill:.38; --focus:#7AA5FF;
  --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 2px 8px rgba(0,0,0,.4);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

#app{position:relative;height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
@media (min-width:600px){#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.12)}}

/* header */
.top{flex:none;padding:10px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.wm{position:relative;display:inline-flex;align-items:baseline;font-weight:850;font-stretch:112%;font-size:23px;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.wm .wm-r{position:relative;color:var(--red)}
.arcs{position:absolute;left:.06em;top:-.52em;width:.5em;height:.5em;overflow:visible}
.arcs path{fill:none;stroke:var(--red);stroke-width:2.4;stroke-linecap:round}
.mode{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.mode.on{color:var(--ink)}
.mode.on i{background:var(--a-plenty);box-shadow:0 0 0 3px color-mix(in srgb,var(--a-plenty) 25%,transparent)}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search svg{width:18px;height:18px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px;height:100%}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}

main{position:relative;flex:1;min-height:0}
#mapWrap{position:absolute;inset:0}
#map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:var(--land)}
#map:active{cursor:grabbing}
#panel{position:absolute;inset:0;overflow:auto;background:var(--bg);-webkit-overflow-scrolling:touch}

/* map svg classes */
.lot{fill:transparent;stroke:none}
.lotsel-c{fill:none;stroke:#fff;stroke-width:7;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.lotsel{fill:rgba(255,255,255,.25);stroke:var(--brand-navy);stroke-width:3.2;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.veil{fill:rgba(12,22,38,.52);pointer-events:none}
.zfo{fill:none;stroke:#fff;stroke-width:2.4;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.mapimg{pointer-events:none}
:root[data-theme="dark"] .mapimg{filter:brightness(.8) saturate(.95)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mapimg{filter:brightness(.8) saturate(.95)}}
.lotpin{transition:opacity .2s}
.dim{opacity:.22}
.bl{font-size:11px;font-weight:700;fill:#10223F;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;cursor:pointer}
.rl{font-size:9.5px;font-weight:600;font-style:italic;fill:var(--muted);text-anchor:middle}
.gl{font-size:15px;font-weight:800;font-stretch:110%;fill:#1E4D22;text-anchor:middle;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:4px;stroke-linejoin:round;cursor:pointer}
.pbg{fill:var(--navy);stroke:var(--surface);stroke-width:2.5}
.ptx{fill:#fff;font-size:14px;font-weight:800;text-anchor:middle}
.lvl{stroke:var(--surface);stroke-width:2}
.lvl.rep{fill:var(--lc)}
.lvl.est{fill:var(--surface);stroke:var(--lc);stroke-width:2.6}
.plabel{font-size:11px;font-weight:700;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round}
.lotpin.sel .pbg{fill:var(--red)}
.ebg{fill:var(--red);stroke:#fff;stroke-width:2.5}
.eic{fill:#fff}
.pulse{fill:var(--red);opacity:.5;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.5}to{transform:scale(2.7);opacity:0}}
.cbg{fill:var(--brand-navy);stroke:#fff;stroke-width:2.5}
:root[data-theme="dark"] .cbg{fill:#2B4F8C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cbg{fill:#2B4F8C}}
.cic{fill:#fff}
.clbg{fill:var(--a-some);stroke:#fff;stroke-width:2.5}
.dbg{fill:var(--red);stroke:#fff;stroke-width:2}
.rt-c{fill:none;stroke:var(--surface);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rt{fill:none;stroke:var(--navy);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.m-land{fill:var(--land)}.m-water{fill:var(--water)}.m-creek{fill:none;stroke:var(--water)}.m-block{fill:var(--block)}.m-green{fill:var(--green)}.m-green2{fill:var(--green-2)}
.m-bldg{fill:var(--bldg);stroke:var(--bldg-line);stroke-width:2}.m-cas{stroke:var(--casing);fill:none}.m-road{stroke:var(--road);fill:none}.m-stall{stroke:var(--stall)}
#sheet[data-type="newReport"]{max-height:62%}
.dst{fill:var(--navy);stroke:#fff;stroke-width:2.5}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:.25;transform:scale(1.6)}}


/* map overlay UI */
#mapUI{position:absolute;inset:0;pointer-events:none}
#mapUI > *{pointer-events:auto}
.ctrls{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-sm);border:1px solid var(--line);overflow:hidden}
.ctrls button{width:42px;height:40px;display:grid;place-items:center;color:var(--ink)}
.ctrls button + button{border-top:1px solid var(--line)}
.ctrls svg{width:20px;height:20px}
.pill{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:650;font-size:14px;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.pill svg{width:18px;height:18px;color:var(--navy)}
.pickbar{position:absolute;left:12px;right:66px;top:12px;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--brand-navy);color:#fff;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.pickbar span{flex:1}
.pickbar button{height:32px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.14);color:#fff;font-weight:650;font-size:13px}
.mapcard{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 12px;box-shadow:var(--shadow)}
.card .chev{margin-left:auto}
.carchip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 8px;border-radius:999px;background:var(--brand-navy);color:#fff;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-sm);max-width:100%}
.carchip .ci{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.carchip .ci svg{width:16px;height:16px}
.carchip em{font-style:normal;opacity:.7;font-weight:500;white-space:nowrap}
.carchip .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carchip.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.carchip.ghost .ci{background:var(--surface-2);color:var(--navy)}
.more{align-self:flex-end;margin-top:-2px;font-size:13px;font-weight:650;color:var(--navy);background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow-sm)}

/* icons in rows */
.ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ic svg{width:22px;height:22px}
.ic.enf{background:color-mix(in srgb,var(--red) 14%,var(--surface));color:var(--red)}
.ic.enf.solid{background:var(--red);color:#fff}
.ic.clo{background:color-mix(in srgb,var(--a-some) 22%,var(--surface));color:color-mix(in srgb,var(--a-some) 60%,var(--ink))}
.ic.av{background:color-mix(in srgb,var(--lc) 16%,var(--surface));color:var(--lc)}
.ic.quiet{background:color-mix(in srgb,var(--a-plenty) 14%,var(--surface));color:var(--a-plenty)}
.ic.car{background:var(--brand-navy);color:#fff}
.row-main{display:flex;flex-direction:column;min-width:0;flex:1}
.row-t{font-weight:700;font-size:15px;line-height:1.25}
.row-s{font-size:13.5px;color:var(--muted);line-height:1.35}
.row-s b{color:var(--ink);font-weight:650}
.chev{flex:none;width:18px;height:18px;color:var(--muted)}

/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:74%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(15,27,46,.18);padding:6px 18px 18px;z-index:4;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sh-head h2{margin:0;font-size:20px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.sh-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.x{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.x svg{width:18px;height:18px}
.zs{flex:none;width:16px;height:16px;border-radius:5px;background:var(--zc);display:inline-block;box-shadow:inset 0 0 0 1px rgba(15,27,46,.22)}
.zs.ol{background:transparent;box-shadow:inset 0 0 0 3.5px var(--zc)}
.zs.big{width:40px;height:40px;border-radius:11px}
.zs.big.ol{box-shadow:inset 0 0 0 6px var(--zc)}
.ob-area{margin-top:14px}
.ob-area .lbl{font-size:14px;font-weight:650;color:#fff;margin-bottom:8px}
.ob-area .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:#fff}
.ob-area .chip[aria-pressed="true"]{background:rgba(255,255,255,.18);border-color:#fff}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.tag.yes{background:color-mix(in srgb,var(--a-plenty) 14%,var(--surface));border-color:color-mix(in srgb,var(--a-plenty) 35%,transparent);color:color-mix(in srgb,var(--a-plenty) 70%,var(--ink))}
.tag.pay{background:color-mix(in srgb,var(--z-vis) 16%,var(--surface));border-color:color-mix(in srgb,var(--z-vis) 40%,transparent);color:color-mix(in srgb,var(--z-vis) 55%,var(--ink))}
.tag.no{color:var(--muted)}
.blk{border-top:1px solid var(--line);padding:14px 0 2px;margin-top:14px}
.blk h3{margin:0 0 8px;font-size:13.5px;font-weight:700;color:var(--muted)}
.avail-now{display:flex;align-items:center;gap:12px}
.avail-now .big{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--lc)}
.dot{flex:none;width:14px;height:14px;border-radius:50%}
.dot.rep{background:var(--lc)}
.dot.est{background:transparent;border:3px solid var(--lc)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.levels button{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.levels button i{width:9px;height:9px;border-radius:50%;background:var(--lc)}
.levels button:hover{border-color:var(--lc)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.btn{height:48px;border-radius:14px;padding:0 12px;white-space:nowrap;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;text-align:center}
.btn svg{width:18px;height:18px}
.btn.red{background:var(--red);color:var(--on-red)}
.btn.red:active{background:var(--red-press)}
.btn.navy{background:var(--navy);color:var(--on-navy)}
.btn.line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{height:54px;font-size:16px;border-radius:16px}
.fine{font-size:12.5px;color:var(--muted);text-align:center;margin:12px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:6px}
.field input{width:100%;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:15px;outline:none}
.field input:focus{border-color:var(--focus);background:var(--surface)}
.loc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.loc svg{width:20px;height:20px;color:var(--red);flex:none}
.loc .row-main{flex:1}
.linkbtn{font-size:13.5px;font-weight:700;color:var(--navy);padding:6px 2px;white-space:nowrap}
:root[data-theme="dark"] .linkbtn{color:#8FB3FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .linkbtn{color:#8FB3FF}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px}
.seg button{height:36px;border-radius:10px;font-weight:650;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--navy);color:var(--on-navy);box-shadow:var(--shadow-sm)}
.detail{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.note{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px}
.seen{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--muted)}
.seen b{color:var(--ink)}
.summary{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--brand-navy);color:#fff;margin-bottom:12px}
.summary .row-s{color:rgba(255,255,255,.72)}
.summary .mins{font-size:26px;font-weight:850;font-stretch:108%;line-height:1;text-align:center;min-width:56px}
.summary .mins small{display:block;font-size:11.5px;font-weight:600;opacity:.75;font-stretch:100%}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.opt + .opt{margin-top:8px}
.opt[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.opt .w{margin-left:auto;text-align:right;font-weight:750;white-space:nowrap}
.opt .w small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}

/* panels */
.pn{padding:18px 16px 28px}
.pn h1{margin:0 0 14px;font-size:26px;font-weight:850;letter-spacing:-.02em;font-stretch:104%}
.pn .seg{margin-bottom:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--surface)}
.row + .row{border-top:1px solid var(--line)}
button.row:hover{background:var(--surface-2)}
.cap{font-size:12.5px;color:var(--muted);margin:10px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cap span{display:inline-flex;align-items:center;gap:6px}
.cap .dot{width:11px;height:11px}
.cap .dot.est{border-width:2.5px}
.empty{text-align:center;padding:30px 20px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.empty .ic{margin:0 auto 10px;width:52px;height:52px}
.empty h2{margin:0 0 4px;font-size:17px}
.empty p{margin:0 0 14px;color:var(--muted);font-size:14px}
.sect{margin-top:22px}
.sect > h2{font-size:14px;font-weight:700;color:var(--muted);margin:0 4px 8px}
.me-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.av-img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--brand-navy)}
.av-ini{width:56px;height:56px;border-radius:50%;flex:none;background:var(--brand-navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--navy)}
.radio.on::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--navy)}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--a-plenty)}
.switch.on::after{transform:translateX(20px)}
.inrow{padding:13px 14px;background:var(--surface)}
.inrow + .row,.row + .inrow{border-top:1px solid var(--line)}
.inrow .field{margin-top:0}
.plus{margin-top:22px;border-radius:20px;background:var(--brand-navy);color:#fff;padding:20px;position:relative;overflow:hidden}
.plus::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 1.5px,transparent 1.5px 26px)}
.plus h2{margin:0;font-size:24px;font-weight:850;font-stretch:112%;letter-spacing:-.02em;position:relative}
.plus h2 span{color:#FF5C6C}
.plus p{margin:4px 0 12px;color:rgba(255,255,255,.75);font-size:14px;position:relative}
.plus ul{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px;position:relative}
.plus li{display:flex;gap:10px;align-items:center;font-size:14.5px}
.plus li svg{width:18px;height:18px;flex:none;color:#7FD4A4}
.plus .price{font-size:14px;color:rgba(255,255,255,.8);margin:10px 0 0;text-align:center;position:relative}
.about{font-size:14px;color:var(--muted);padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.about p{margin:0 0 8px}
.about p:last-child{margin:0}

/* search results */
#searchRes{position:absolute;left:12px;right:12px;top:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;z-index:6;max-height:60%;overflow-y:auto}

/* tabs */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 6px;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--muted);padding:4px 0;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--navy)}
:root[data-theme="dark"] .tab[aria-current="page"]{color:#8FB3FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-current="page"]{color:#8FB3FF}}
.tab .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:750;display:grid;place-items:center;border:2px solid var(--surface)}
.tab.rep .rb{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--red) 45%,transparent);border:3px solid var(--surface)}
.tab.rep .rb svg{width:26px;height:26px}
.tab.rep{color:var(--ink)}

/* toast + banner */
#toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,20px);max-width:calc(100% - 32px);width:max-content;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#banner{position:absolute;left:10px;right:10px;top:8px;z-index:8;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--red);color:#fff;box-shadow:var(--shadow);animation:drop .25s ease-out}
#banner.navy{background:var(--brand-navy)}
#banner .bt{font-weight:750;font-size:15px}
#banner .bs{font-size:13.5px;opacity:.9}
#banner .x{background:rgba(255,255,255,.18);color:#fff}
#banner .main{flex:1;text-align:left;color:#fff;display:flex;align-items:center;gap:12px}
#banner .ic{background:rgba(255,255,255,.18);color:#fff}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#banner{animation:none}}

/* onboarding */
#onboard{position:absolute;inset:0;z-index:30;background:var(--brand-navy);color:#fff;overflow:auto;
  background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:64px 64px;background-position:center}
.ob{min-height:100%;display:flex;flex-direction:column;padding:28px 24px 28px;max-width:440px;margin:0 auto}
.radar{position:relative;width:min(68vw,250px);aspect-ratio:1;margin:18px auto 26px;border-radius:50%;background:radial-gradient(circle,rgba(214,40,57,.10),rgba(19,39,74,0) 70%)}
.radar .ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.16);inset:0}
.radar .r2{inset:17%}.radar .r3{inset:34%}
.radar .axis{position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:rgba(255,255,255,.08)}
.radar .axis.h{left:0;right:0;top:50%;bottom:auto;width:auto;height:1.5px}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(214,40,57,0) 0deg,rgba(214,40,57,0) 270deg,rgba(238,64,82,.55) 358deg,rgba(214,40,57,0) 360deg);animation:spin 3.6s linear infinite}
.radar .blip{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:#FF4A5C;box-shadow:0 0 0 6px rgba(255,74,92,.18);opacity:0;animation:blip 3.6s linear infinite}
.radar .b1{left:72%;top:30%;animation-delay:.4s}
.radar .b2{left:24%;top:66%;animation-delay:2.2s}
.radar .b3{left:63%;top:78%;animation-delay:1.5s;background:#43C77F;box-shadow:0 0 0 6px rgba(67,199,127,.18)}
.radar .core{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:14px;background:#fff;color:var(--brand-navy);display:grid;place-items:center;font-weight:900;font-size:30px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:0;transform:scale(.4)}6%{opacity:1;transform:scale(1)}55%{opacity:.8}80%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.radar .sweep{animation:none;transform:rotate(40deg)}.radar .blip{animation:none;opacity:.9}}
.ob-wm{font-size:clamp(44px,13vw,58px);font-weight:900;font-stretch:112%;letter-spacing:-.03em;line-height:.95;margin:0;text-align:center;position:relative}
.ob-wm span{color:#FF4052}
.ob-tag{margin:12px 0 0;text-align:center;font-size:17px;font-weight:600;color:rgba(255,255,255,.9)}
.ob-copy{margin:14px auto 0;max-width:34ch;text-align:center;color:rgba(255,255,255,.72);font-size:15px;line-height:1.5}
.ob-fill{flex:1;min-height:20px}
.ob-foot{margin:14px 0 0;text-align:center;font-size:13px;color:rgba(255,255,255,.6)}
.ob h2{font-size:26px;font-weight:850;letter-spacing:-.02em;margin:10px 0 4px}
.ob .sub{color:rgba(255,255,255,.72);margin:0 0 18px}
.ob-permits{display:grid;gap:8px}
.ob-permit{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);color:#fff;text-align:left}
.ob-permit[aria-pressed="true"]{background:rgba(255,255,255,.16);border-color:#fff}
.ob-permit .row-s{color:rgba(255,255,255,.65)}
.ob-permit .radio{border-color:rgba(255,255,255,.4)}
.ob-permit .radio.on{border-color:#fff}
.ob-permit .radio.on::after{background:#fff}
.ob .field span{color:rgba(255,255,255,.75)}
.ob .field input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.ob .field input::placeholder{color:rgba(255,255,255,.45)}
.ob .back{align-self:flex-start;color:rgba(255,255,255,.8);font-weight:650;font-size:14px;padding:6px 0}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="wm" role="img" aria-label="ParkRadar"><span>Park</span><span class="wm-r"><svg class="arcs" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 10.5A3.5 3.5 0 0 1 5.5 14"/><path d="M2 6.5A7.5 7.5 0 0 1 9.5 14"/><path d="M2 2.5A11.5 11.5 0 0 1 13.5 14"/></svg>Radar</span></div>
      <button class="mode" id="modePill" data-act="modeInfo"><i></i><span>Connecting</span></button>
    </div>
    <label class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Search lots and places" autocomplete="off" aria-label="Search lots and places">
    </label>

  <main id="main">
    <div id="mapWrap">
      <svg id="map" preserveAspectRatio="xMidYMid meet" aria-label="Campus parking map">
        <g id="baseL"><rect class="m-land" x="-4000" y="-4000" width="10102" height="9586"/><image class="mapimg" href="/.netlify/images?url=/map.webp" onerror="this.onerror=null;this.setAttribute('href','map.webp')" x="0" y="0" width="2102" height="1586" preserveAspectRatio="none"/></g><g id="lotsL"></g><g id="selL"></g><g id="routeL"></g><g id="labelsL"></g><g id="pinsL"></g>
      </svg>
      <div id="mapUI"></div>
    </div>
    <section id="panel" hidden></section>
    <div id="sheet" hidden role="dialog" aria-modal="false"></div>
    <div id="searchRes" hidden></div>
    <div id="banner" hidden></div>
  </main>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="onboard" hidden></div>
</div>

<script>
(() => {
'use strict';

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MIN = 60000;
const ENF_TTL = 15 * MIN;
const AVAIL_TTL = 60 * MIN;
const MAP_W = 2102, MAP_H = 1586;    // base map image size; map units are image pixels
const U_PER_MI = 1341;               // about 1.2 m per pixel, checked against the stadium, Swayze Field and the Circle
const MAP_V = 2;                     // data version: reports and saved cars from the old schematic map are ignored
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ---------------- icons ---------------- */
const CAR_PATH = 'M-7.6 1.4 L-5.9 -3.3 A1.9 1.9 0 0 1 -4.1 -4.6 H4.1 A1.9 1.9 0 0 1 5.9 -3.3 L7.6 1.4 V5.3 A1 1 0 0 1 6.6 6.3 H5.3 A1 1 0 0 1 4.3 5.3 V4.7 H-4.3 V5.3 A1 1 0 0 1 -5.3 6.3 H-6.6 A1 1 0 0 1 -7.6 5.3 Z M-4.4 0.1 H4.4 L3.5 -2.6 A.6 .6 0 0 0 2.9 -3 H-2.9 A.6 .6 0 0 0 -3.5 -2.6 Z M-5.4 2.9 a1.1 1.1 0 1 0 2.2 0 a1.1 1.1 0 1 0 -2.2 0 Z M3.2 2.9 a1.1 1.1 0 1 0 2.2 0 a1.1 1.1 0 1 0 -2.2 0 Z';
const I = {
  car: `<svg viewBox="-10 -10 20 20" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="${CAR_PATH}"/></svg>`,
  chev: `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`,

  minus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>`,

  walk: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="1.8"/><path d="m9 20 2.5-6 2.5 2v4.5M7.5 11.5 10 8.5l3.5-.5 2 3.5 2.5 1M11.5 14l1-5.5"/></svg>`,
  pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.8" r="2.4"/></svg>`,
  warn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.8 19.5h18.4L12 4Z"/><path d="M12 10v4.2M12 17h.01"/></svg>`,
  radar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M15.9 8.1a5.5 5.5 0 0 1 0 7.8M8.1 15.9a5.5 5.5 0 0 1 0-7.8M18.8 5.2a9.6 9.6 0 0 1 0 13.6M5.2 18.8a9.6 9.6 0 0 1 0-13.6"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>`,
  bldg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11M4 20h16M9 20v-6h6v6"/></svg>`,
  tabMap: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3.5 6.2v13.6L9 17.6l6 2.4 5.5-2.2V4.2L15 6.4 9 4Z"/><path d="M9 4v13.6M15 6.4V20"/></svg>`,
  tabLots: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M10 16.5v-9h3.2a2.7 2.7 0 0 1 0 5.4H10"/></svg>`,
  tabBell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10.2a6 6 0 1 1 12 0c0 5 2 6.6 2 6.6H4s2-1.6 2-6.6Z"/><path d="M10 19.8a2.1 2.1 0 0 0 4 0"/></svg>`,
  tabMe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.7"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>`,
};

/* ---------------- campus data ----------------
   Base map is the Ole Miss parking map image. Lot outlines were traced from its colors:
   dark red = Commuter Red, blue = Commuter Blue, white = Faculty/Staff, six colors = residential areas,
   blue ring on the Circle = visitor parking, bright red outlines = pay parking.
   Lot names are descriptive, except Jackson Ave Center, South Lot, Pavilion Garage and Lyceum Circle. */
const ZONES = {
  blue: { name:'Commuter Blue', color:'var(--z-blue)', rule:'Commuter Blue and Faculty/Staff permits' },
  red:  { name:'Commuter Red',  color:'var(--z-red)',  rule:'Any valid UM permit' },
  res:  { name:'Residential',   color:'var(--z-res)',  rule:'Residential permit for this area' },
  fac:  { name:'Faculty/Staff', color:'var(--z-fac)',  rule:'Faculty/Staff permit only' },
  vis:  { name:'Visitor',       color:'var(--z-vis)',  rule:'Visitor permit required', ol:true },
  pay:  { name:'Pay to park',   color:'var(--z-pay)',  rule:'Open to anyone who pays', ol:true },
};
const RES_AREAS = {
  orange:{ name:'Orange', color:'#DC7938' }, lgreen:{ name:'Light green', color:'#5FC63F' }, dgreen:{ name:'Dark green', color:'#31611A' },
  brown:{ name:'Brown', color:'#6A4E24' }, cyan:{ name:'Teal', color:'#4FE0DA' }, mag:{ name:'Pink', color:'#CD32C4' },
};
const PERMITS = [
  ['blue', 'Commuter Blue', 'Closer-in commuter lots, plus Commuter Red'],
  ['red', 'Commuter Red', 'Perimeter commuter lots'],
  ['res', 'Residential', 'Your residential area, plus Commuter Red'],
  ['fac', 'Faculty/Staff', 'Faculty/Staff lots, plus all commuter lots'],

  if (p.rects) return [Math.min(...p.rects.map(r => r[0])), Math.min(...p.rects.map(r => r[1])), Math.max(...p.rects.map(r => r[2])), Math.max(...p.rects.map(r => r[3]))];
  return [p.x - p.r, p.y - p.r, p.x + p.r, p.y + p.r];
}
const boxDist = (b, x, y) => Math.hypot(Math.max(b[0]-x, 0, x-b[2]), Math.max(b[1]-y, 0, y-b[3]));
function rectDist(p, x, y) { return p.rects ? Math.min(...p.rects.map(r => boxDist(r, x, y))) : boxDist(bounds(p), x, y); }
function describe(x, y) {
  let best = null, bd = Infinity;
  for (const p of [...LOTS, ...PLACES]) {
    const d = rectDist(p, x, y) + (p.rects ? 0 : 6); // prefer lots on ties
    if (d < bd) { bd = d; best = p; }
  }
  const isLot = !!best.rects;
  return { place:best, isLot, text:(isLot && bd === 0 ? 'At ' : 'Near ') + best.name };
}
function nearestLot(x, y, max = Infinity) {
  let best = null, bd = Infinity;
  for (const l of LOTS) { const d = rectDist(l, x, y); if (d < bd) { bd = d; best = l; } }
  return bd <= max ? best : null;
}

/* ---------------- formatting ---------------- */

const lc = s => s.charAt(0).toLowerCase() + s.slice(1);

/* ---------------- domain ---------------- */
function permitStatus(l) {
  const p = S.profile.permit, z = l.zone;
  if (z === 'pay') return 'pay';
  if (z === 'red') return p === 'vis' ? 'no' : 'yes';
  if (z === 'blue') return p === 'blue' || p === 'fac' ? 'yes' : 'no';
  if (z === 'fac') return p === 'fac' ? 'yes' : 'no';
  if (z === 'vis') return p === 'vis' ? 'yes' : 'no';
  if (z === 'res') return p === 'res' && (!S.profile.resArea || S.profile.resArea === l.area) ? 'yes' : 'no';
  return 'no';
}
function needsText(l) {
  if (l.zone === 'red') return 'Needs a UM parking permit';
  if (l.zone === 'blue') return 'Needs Commuter Blue or Faculty/Staff';
  if (l.zone === 'fac') return 'Needs a Faculty/Staff permit';
  if (l.zone === 'vis') return 'Visitor permits only';
  if (l.zone === 'res') return `Needs a Residential ${RES_AREAS[l.area].name} permit`;
  return 'Not covered by your permit';
}
function permitTag(l) {
  const s = permitStatus(l);
  if (s === 'yes') return `<span class="tag yes">${I.check.replace('<svg', '<svg width="14" height="14"')}Your permit works here</span>`;
  if (s === 'pay') return `<span class="tag pay">Pay to park</span>`;
  return `<span class="tag no">${esc(needsText(l))}</span>`;
}
function permitLabel() {
  const p = S.profile.permit;
  if (p === 'vis') return 'Visitor or no permit';
  if (p === 'res') return `Residential${S.profile.resArea ? ' ' + RES_AREAS[S.profile.resArea].name : ''} permit`;
  return ZONES[p] ? ZONES[p].name + ' permit' : '';

  if (day === 0 || day === 6) return 'plenty';
  const curve = h < 7 ? .1 : h < 8 ? .35 : h < 9.5 ? .7 : h < 14 ? .95 : h < 16 ? .75 : h < 18 ? .45 : .2;

  } else if (c === 'quota_exceeded') toast('Report storage is full. Old reports need clearing before new ones can post.');
  else if (c === 'resource_exhausted') toast('Too many updates at once. Wait a moment and try again.');
  else if (c === 'revoked') toast('Access to live reports ended. Reload to reconnect.');

    catch (e) { handleWriteErr(e); return false; }

async function initRuntime() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') { S.mode = 'local'; syncHeader(); return; }
  let user = null, db = null;
  try { user = await cl.use('user'); } catch {}
  if (user) {
    try { const me = await user.me(); S.me = { id:me.id, name:me.name || '', avatar:me.avatarUrl || null }; } catch {}
    try { const c = await user.can('data.write'); if (c === false) S.readOnly = true; } catch {}

  try { db = await cl.use('db'); } catch {}
  if (!db) { S.mode = 'local'; syncHeader(); render(); return; }
  S.db = db; S.mode = 'live'; S.reports = []; S.lots = {};
  syncHeader();
  db.collection('reports').orderBy('at', 'desc').limit(200).onSnapshot(snap => {
    for (const ch of snap.docChanges()) if (ch.type === 'added') maybeAlert({ id:ch.doc.id, ...ch.doc.data() });
    S.reports = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    refreshLive();
  }, err => { if (err && err.code === 'revoked') { S.mode = 'local'; syncHeader(); } });
  db.collection('lots').onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) next[d.id] = d.data();
    S.lots = next; refreshLive();
  }, () => {});
  if (S.me.id) {
    try {
      const snap = await db.doc(`data/users/${S.me.id}/profile`).get();
      if (snap.exists) { S.profile = { ...DEFAULT_PROFILE, ...snap.data() }; sanitizeProfile(); lsSet('pr.profile', S.profile); }
      else if (S.profile.onboarded) saveProfile();
    } catch {}
  }
  render();
}

function maybeAlert(r) {
  if (!S.profile.alertsOn || r.kind !== 'enforcement' || !(r.at > S.loadedAt) || r.by === myKey()) return;
  S.now = Date.now();
  const c = S.profile.car, d = describe(r.x, r.y);
  if (c && dist(c, r) / U_PER_MI <= S.profile.radius) {
    banner('Enforcement near your car', `${d.text}, ${carDistText(r.x, r.y)}`, 'report:' + r.id);
    try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch {}
  } else if (inMyZones(r.x, r.y)) {
    banner('Enforcement reported', `${d.text}, in one of your zones`, 'report:' + r.id);

}

function handleTap(cx, cy) {
  hideSearch();
  if (S.pick) {
    const p = toSvg(cx, cy);
    if (S.pick === 'report') {
      S.draft.x = p.x; S.draft.y = p.y; S.draft.moved = true;
      renderPins();
      const el = $('#draftLoc'); if (el) el.textContent = describe(p.x, p.y).text;
    } else if (S.pick === 'car') {
      setCar(p.x, p.y);
    } else if (S.pick === 'dest' && S.walk) {
      S.walk.dest = 'pt'; S.walk.destPt = { x:p.x, y:p.y }; S.pick = null;
      render(); fitWalk();
    }
    return;
  }
  const hit = document.elementFromPoint(cx, cy);
  const t = hit && hit.closest && hit.closest('[data-tap]');
  if (t) {
    const [type, id] = t.dataset.tap.split(':');
    if (type === 'lot') return openLot(id);
    if (type === 'rep') return openReport(id);
    if (type === 'car') return openSheet({ type:'car' });
    if (type === 'place') { S.walk = { from:null, lot:null, dest:id }; openSheet({ type:'walk' }); fitWalk(); return; }
  }
  if (S.sheet) closeSheet();
}

/* base map (image is static in the markup; lots and labels drawn once) */
function drawBase() {
  $('#lotsL').innerHTML = LOTS.map(l => `<path class="lot" data-tap="lot:${l.id}" d="${l.d}"/>`).join('');
  $('#labelsL').innerHTML = PLACES.map(p => `<g data-s="${p.x},${p.y}" data-tap="place:${p.id}"><text class="${p.open ? 'gl' : 'bl'}${p.key ? ' key' : ''}" y="4">${esc(p.short || p.name)}</text></g>`).join('');
}

/* dynamic layers */
function walkDestOf(w) {
  if (w.dest === 'pt') return w.destPt ? { id:'pt', name:'your pin', x:w.destPt.x, y:w.destPt.y } : null;
  return PLACE_BY[w.dest] || null;
}
function walkPlan() {
  const w = S.walk; if (!w || !w.dest) return null;
  const dest = walkDestOf(w); if (!dest) return null;
  if (w.from === 'car' && S.profile.car) return { dest, fromCar:true, route:route(S.profile.car, dest), options:[] };
  const options = rankLots(dest);
  const lot = (w.lot && LOT_BY[w.lot]) || (options[0] && options[0].lot);
  if (!lot) return null;
  const opt = options.find(o => o.lot === lot) || { lot, route:route(center(lot), dest) };
  return { dest, lot, route:opt.route, options };
}
function rankLots(dest) {
  let list = LOTS.map(l => ({ lot:l, ok:permitStatus(l), st:lotStatus(l), crow:dist(center(l), dest) }));
  const allowed = list.filter(o => o.ok !== 'no');
  if (allowed.length) list = allowed;
  list = list.sort((a, b) => a.crow - b.crow).slice(0, 14);   // only route the closest candidates
  for (const o of list) o.route = route(center(o.lot), dest);
  const okRank = { yes:0, pay:1, no:2 };
  return list.sort((a, b) => (okRank[a.ok] - okRank[b.ok]) || ((a.st.level === 'full') - (b.st.level === 'full')) || (a.route.d - b.route.d)).slice(0, 8);
}

  if (S.sheet && S.sheet.type === 'lot') return S.sheet.id;
  const wp = S.sheet && S.sheet.type === 'walk' ? walkPlan() : null;
  return wp && wp.lot ? wp.lot.id : null;
}

/* sheets */

}
function closeSheet() {

}
function openLot(id) {

function renderSheet() {

      <p class="ob-copy">See where students just spotted parking enforcement, which lots still have room, and where your permit works.</p>
      <div class="ob-fill"></div>
      <button class="btn red big full" data-act="obNext">Get started</button>
      <p class="ob-foot">Built by students, for students.</p></div>`;
  } else {
    const hi = S.me.name ? `Hi ${esc(S.me.name.split(' ')[0])}. ` : '';
    el.innerHTML = `<div class="ob"><button class="back" data-act="obBack">Back</button>
      <h2>${hi}Which permit do you have?</h2><p class="sub">We use it to show where you can park. You can change it later.</p>
      <div class="ob-permits">${PERMITS.map(([id, label, sub]) => `<button class="ob-permit" data-act="permit" data-v="${id}" aria-pressed="${S.profile.permit === id}"><span class="radio ${S.profile.permit === id ? 'on' : ''}"></span><span class="zs" style="--zc:${ZONES[id].color}"></span><span class="row-main"><span class="row-t">${label}</span><span class="row-s">${sub}</span></span></button>`).join('')}</div>
      ${S.profile.permit === 'res' ? `<div class="ob-area">${resAreaPicker(true)}</div>` : ''}
      <label class="field" style="margin-top:18px"><span>Your vehicle (optional)</span><input data-bind="vehicle" value="${esc(S.profile.vehicle)}" placeholder="e.g. Toyota Tacoma, gray" maxlength="60"></label>
      <div class="ob-fill"></div>
      <button class="btn red big full" style="margin-top:20px" data-act="obDone">Show me the map</button></div>`;
  }
}

function render() {
  syncHeader(); renderTabs(); renderPanel(); renderSheet(); renderMapDyn(); renderMapUI(); renderOnboard();
}
const isTyping = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.id !== 'q'; };
function refreshLive() {
  S.now = Date.now();
  renderTabs(); renderMapDyn(); renderMapUI();
  if (S.tab !== 'map' && !isTyping()) renderPanel();
  if (S.sheet && S.sheet.type !== 'newReport' && !isTyping()) renderSheet();
}

/* toast + banner */
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}
let bannerT = 0;
function banner(title, sub, act, navy = false) {
  const b = $('#banner');
  b.className = navy ? 'navy' : '';
  b.innerHTML = `<button class="main" data-act="bannerGo" data-v="${esc(act || '')}"><span class="ic">${navy ? I.clock : I.car}</span><span class="row-main"><span class="bt">${esc(title)}</span><span class="bs">${esc(sub)}</span></span></button><button class="x" data-act="bannerX" aria-label="Dismiss">${I.x}</button>`;
  b.hidden = false;
  clearTimeout(bannerT); bannerT = setTimeout(() => { b.hidden = true; }, 9000);
}

/* search */
function renderSearch() {
  const el = $('#searchRes'), q = S.q.trim().toLowerCase();
  if (!q || S.tab !== 'map') { el.hidden = true; return; }
  const res = [
    ...PLACES.filter(p => (p.name + ' ' + (p.short || '')).toLowerCase().includes(q)).map(p => ({ t:'place', p })),
    ...LOTS.filter(l => (l.name + ' ' + zoneName(l)).toLowerCase().includes(q)).map(l => ({ t:'lot', p:l })),
  ].slice(0, 14);
  el.hidden = false;
  el.innerHTML = res.length ? res.map(r => r.t === 'lot'
    ? `<button class="row" data-act="searchPick" data-v="lot:${r.p.id}">${zswatch(zoneKey(r.p))}<span class="row-main"><span class="row-t">${esc(r.p.name)}</span><span class="row-s">${esc(zoneName(r.p))}</span></span>${I.chev}</button>`
    : `<button class="row" data-act="searchPick" data-v="place:${r.p.id}"><span style="width:18px;height:18px;color:var(--muted)">${I.bldg}</span><span class="row-main"><span class="row-t">${esc(r.p.name)}</span><span class="row-s">Plan a walk here</span></span>${I.chev}</button>`).join('')
    : `<div class="row"><span class="row-main"><span class="row-t">No matches</span><span class="row-s">Try a lot like "South Lot" or a place like "Library".</span></span></div>`;
}
function hideSearch() { $('#searchRes').hidden = true; }
$('#q').addEventListener('input', e => { S.q = e.target.value; renderSearch(); });
$('#q').addEventListener('focus', () => renderSearch());
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; S.q = ''; hideSearch(); e.target.blur(); } });

/* car */
function setCar(x, y) {
  const lot = nearestLot(x, y, 0);
  S.profile.car = { v:MAP_V, x, y, lot: lot ? lot.id : null, at: Date.now(), remindAt: null, remindMins: 0 };
  S.pick = null; saveProfile();
  toast('Spot saved. We\'ll flag enforcement near your car.');
  openSheet({ type:'car' });
}

/* ---------------- actions ---------------- */
function startReport() {
  if (S.readOnly) { toast('Posting is off for your access level.'); return; }
  hideSearch();
  const c = S.profile.car, s = mapSize(), k = kpx();
  let x, y;
  if (c) { x = c.x; y = c.y; }
  else { const p = toSvg(s.left + s.w/2, s.top + s.h * .35); x = clamp(p.x, 60, MAP_W - 60); y = clamp(p.y, 60, MAP_H - 60); }
  S.draft = { kind:'enforcement', x, y, vehicle:'', plate:'', note:'', dur:60 };
  S.pick = 'report';
  openSheet({ type:'newReport' });
  requestAnimationFrame(() => focusPoint(x, y, clamp(vb.w, 640, 1400)));
}
async function submitReport() {
  const d = S.draft; if (!d) return;
  const now = Date.now();
  const place = describe(d.x, d.y).place;
  if (d.kind === 'closure') {
    if (!d.note.trim()) { toast('Add a short description of what\'s closed.'); $('[data-draft="note"]')?.focus(); return; }
    let until;
    if (d.dur === 'day') { const e = new Date(); e.setHours(23, 59, 0, 0); until = e.getTime(); }
    else until = now + Number(d.dur) * MIN;
    const ok = await addReport({ kind:'closure', x:d.x, y:d.y, place:place.id, note:d.note.trim().slice(0, 80), at:now, until, by:myKey(), confirms:{}, gone:{} });
    if (ok) { toast('Closure posted.'); closeSheet(); }
    return;
  }
  const ok = await addReport({ kind:'enforcement', x:d.x, y:d.y, place:place.id, vehicle:d.vehicle || '', plate:d.plate.trim().slice(0, 12), note:d.note.trim().slice(0, 120), at:now, by:myKey(), confirms:{}, gone:{} });
  if (ok) { toast('Report posted. Thanks for looking out.'); closeSheet(); }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) { if (!e.target.closest('#searchRes') && e.target.id !== 'q') hideSearch(); return; }
  const act = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  if (act !== 'searchPick') hideSearch();
  switch (act) {
    case 'tab':
      S.tab = v; S.sheet = null; S.pick = null; S.walk = null; S.draft = null; S.zoneFocus = null;
      document.getElementById('panel').scrollTop = 0;
      render(); if (v === 'map') settleView(); break;
    case 'startReport': startReport(); break;
    case 'modeInfo':
      toast(S.mode === 'live' ? 'Live: reports update in real time for everyone using this app.' : S.mode === 'local' ? 'Reports are saved on this device only right now.' : 'Connecting to live reports…');
      break;
    case 'zoomIn': animateTo(zoomBy(1/1.6)); break;
    case 'zoomOut': animateTo(zoomBy(1.6)); break;
    case 'fit': fitCampus(); break;
    case 'lot': openLot(id); break;
    case 'report': openReport(id); break;
    case 'closeSheet': closeSheet(); break;
    case 'avail': {
      const lid = S.sheet && S.sheet.id; if (!lid) break;
      if (await setLotLevel(lid, v)) toast(`Thanks. ${LOT_BY[lid].name} marked as ${LEVELS[v].label.toLowerCase()}.`);
      break;
    }
    case 'parkHere': { const l = LOT_BY[id], c = center(l); setCar(c.x, c.y); break; }
    case 'walkFrom': S.walk = { from:null, lot:id, fixed:true, dest:null }; openSheet({ type:'walk' }); break;
    case 'planWalk': S.walk = { from:null, lot:null, dest:null }; openSheet({ type:'walk' }); break;
    case 'carWalk': S.walk = { from:'car', dest:null }; openSheet({ type:'walk' }); break;
    case 'walkAll': S.walk.lot = null; S.walk.fixed = false; renderSheet(); renderMapDyn(); fitWalk(); break;
    case 'walkDest':
      if (v === 'pt') { S.pick = 'dest'; renderSheet(); renderMapUI(); break; }
      S.pick = null; S.walk.dest = v; renderSheet(); renderMapDyn(); renderMapUI(); fitWalk(); break;
    case 'walkPick': S.walk.lot = id; renderSheet(); renderMapDyn(); fitWalk(); { const s = $('#sheet'); s.scrollTop = 0; } break;
    case 'openCar': openSheet({ type:'car' }); requestAnimationFrame(() => S.profile.car && focusPoint(S.profile.car.x, S.profile.car.y, 640)); break;
    case 'carPick': S.tab = 'map'; S.sheet = null; S.walk = null; S.zoneFocus = null; S.pick = 'car'; render(); break;
    case 'cancelPick': S.pick = null; render(); break;
    case 'carRemove': S.profile.car = null; saveProfile(); closeSheet(); toast('Saved spot removed.'); break;
    case 'carRemind': {
      const c = S.profile.car; if (!c) break;
      const m = Number(v); c.remindMins = m; c.remindAt = m ? Date.now() + m * MIN : null; c.warned = false; c.doneAlert = false;
      saveProfile(); renderSheet(); if (m) toast(`Reminder set for ${clock(c.remindAt)}.`); break;
    }
    case 'rkind': S.draft.kind = v; renderSheet(); break;
    case 'rveh': S.draft.vehicle = S.draft.vehicle === v ? '' : v; renderSheet(); break;
    case 'rdur': S.draft.dur = v === 'day' ? 'day' : Number(v); renderSheet(); break;
    case 'rUseCar': { const c = S.profile.car; if (c) { S.draft.x = c.x; S.draft.y = c.y; renderPins(); const el = $('#draftLoc'); if (el) el.textContent = describe(c.x, c.y).text; } break; }
    case 'rSubmit': b.disabled = true; await submitReport(); b.disabled = false; break;
    case 'confirm': {
      const r = S.reports.find(x => x.id === id); if (!r) break;
      if (await patchReport(id, { confirms:{ ...(r.confirms || {}), [myKey()]:Date.now() } })) toast('Thanks. The report stays up another 15 minutes.');
      break;
    }
    case 'gone': {
      const r = S.reports.find(x => x.id === id); if (!r) break;
      if (await patchReport(id, { gone:{ ...(r.gone || {}), [myKey()]:Date.now() } })) { toast(goneCount(r) + 1 >= 2 ? 'Thanks. The report has been cleared.' : 'Thanks. One more "gone" clears it.'); closeSheet(); }
      break;
    }
    case 'removeMine': if (await deleteReport(id)) { toast('Your report was removed.'); closeSheet(); } break;
    case 'lotsSeg': S.lotsSeg = v; renderPanel(); break;
    case 'lotsFilter': S.lotsFilter = v; renderPanel(); break;
    case 'zonesFilter': S.zonesFilter = v; renderPanel(); break;
    case 'alertsSeg': S.alertsSeg = v; renderPanel(); break;
    case 'zone': {
      S.zoneFocus = v; S.tab = 'map'; S.sheet = { type:'zone', id:v }; S.walk = null; S.pick = null; render();
      requestAnimationFrame(() => {
        const bs = LOTS.filter(l => zoneKey(l) === v).map(bounds);
        if (!bs.length) return fitCampus();
        fitBox(Math.min(...bs.map(b => b[0])), Math.min(...bs.map(b => b[1])), Math.max(...bs.map(b => b[2])), Math.max(...bs.map(b => b[3])), true, 560);
      }); break;
    }
    case 'resArea': S.profile.resArea = v; saveProfile(); render(); break;
    case 'permit': S.profile.permit = v; saveProfile(); render(); break;
    case 'radius': S.profile.radius = Number(v); saveProfile(); renderPanel(); break;
    case 'toggleAlerts': S.profile.alertsOn = !S.profile.alertsOn; saveProfile(); renderPanel(); break;
    case 'waitlist': S.profile.waitlist = !S.profile.waitlist; saveProfile(); renderPanel(); toast(S.profile.waitlist ? "You're on the ParkRadar+ waitlist." : 'Removed from the waitlist.'); break;
    case 'reset':
      if (confirm('Reset your permit, vehicle and saved car?')) { S.profile = { ...DEFAULT_PROFILE }; saveProfile(); S.obStep = 0; S.tab = 'map'; render(); }
      break;
    case 'obNext': S.obStep = 1; renderOnboard(); break;
    case 'obBack': S.obStep = 0; renderOnboard(); break;
    case 'obDone': S.profile.onboarded = true; saveProfile(); render(); requestAnimationFrame(() => fitStart(false)); break;
    case 'bannerX': $('#banner').hidden = true; break;
    case 'bannerGo': {
      $('#banner').hidden = true;
      const i = (v || '').indexOf(':'), t = v.slice(0, i), rid = v.slice(i + 1);
      if (t === 'report') openReport(rid); else if (t === 'carSheet') openSheet({ type:'car' });
      break;
    }
    case 'searchPick': {
      const [t, pid] = v.split(':');
      $('#q').value = ''; S.q = ''; hideSearch(); $('#q').blur();
      if (t === 'lot') openLot(pid); else { S.walk = { from:null, lot:null, dest:pid }; openSheet({ type:'walk' }); fitWalk(); }
      break;
    }
  }
});
function fitWalk() {
  requestAnimationFrame(() => {
    const wp = walkPlan(); if (!wp) return;
    const xs = wp.route.pts.map(p => p.x), ys = wp.route.pts.map(p => p.y);
    fitBox(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), true, 520);
  });
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.draft && S.draft) S.draft[t.dataset.draft] = t.value;
  if (t.dataset.bind === 'vehicle') { S.profile.vehicle = t.value; }
});
document.addEventListener('change', e => {
  if (e.target.dataset.bind === 'vehicle') { S.profile.vehicle = e.target.value.trim(); saveProfile(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet && !isTyping()) closeSheet();
  if (e.key === 'Enter' && e.target.dataset.draft) { e.preventDefault(); submitReport(); }
});

/* ---------------- timers ---------------- */
function checkReminder() {
  const c = S.profile.car; if (!c || !c.remindAt) return;
  const left = c.remindAt - S.now;
  if (left <= 0 && !c.doneAlert) {
    c.doneAlert = true; c.warned = true; saveProfile();
    banner('Your parking time is up', `Your time at ${carPlaceText()} ended at ${clock(c.remindAt)}.`, 'carSheet', true);
  } else if (left > 0 && left <= 10 * MIN && !c.warned) {
    c.warned = true; saveProfile();
    banner('10 minutes left', `Your time at ${carPlaceText()} ends at ${clock(c.remindAt)}.`, 'carSheet', true);
  }
}
setInterval(() => { S.now = Date.now(); checkReminder(); refreshLive(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S.now = Date.now(); checkReminder(); refreshLive(); } });

/* ---------------- boot ---------------- */
drawBase();
render();
requestAnimationFrame(() => fitStart(false));
initRuntime();
})();
</script>
</body>
</html>
